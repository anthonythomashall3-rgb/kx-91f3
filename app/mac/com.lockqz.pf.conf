# Block local AI model servers on loopback + LAN (Ollama, LM Studio, GPT4All, Jan, llama.cpp,
# text-gen-webui, LocalAI, vLLM) so a model running on the student's own machine is unreachable.
block drop out proto tcp to any port 11434
block drop out proto tcp to any port 1234
block drop out proto tcp to any port 4891
block drop out proto tcp to any port 1337
block drop out proto tcp to any port 7860
# 8080/5000/8000 are also ordinary web ports: blocked only to this Mac and private networks (where a
# llama.cpp / vLLM server would run), never to the internet.
block drop out proto tcp to 127.0.0.0/8 port 8080
block drop out proto tcp to 10.0.0.0/8 port 8080
block drop out proto tcp to 172.16.0.0/12 port 8080
block drop out proto tcp to 192.168.0.0/16 port 8080
block drop out proto tcp to 169.254.0.0/16 port 8080
block drop out proto tcp to ::1 port 8080
block drop out proto tcp to fc00::/7 port 8080
block drop out proto tcp to fe80::/10 port 8080
block drop out proto tcp to 127.0.0.0/8 port 5000
block drop out proto tcp to 10.0.0.0/8 port 5000
block drop out proto tcp to 172.16.0.0/12 port 5000
block drop out proto tcp to 192.168.0.0/16 port 5000
block drop out proto tcp to 169.254.0.0/16 port 5000
block drop out proto tcp to ::1 port 5000
block drop out proto tcp to fc00::/7 port 5000
block drop out proto tcp to fe80::/10 port 5000
block drop out proto tcp to 127.0.0.0/8 port 8000
block drop out proto tcp to 10.0.0.0/8 port 8000
block drop out proto tcp to 172.16.0.0/12 port 8000
block drop out proto tcp to 192.168.0.0/16 port 8000
block drop out proto tcp to 169.254.0.0/16 port 8000
