# Warm connections (28 Oct 2026): <lq_warm> = the blocklist's hosts resolved at lock (extra-block.sh
# warm_apply). A new TCP connection (SYN) to those addresses still passes - a shared CDN address also
# serves Brightspace/LOCKqz, and a new connection needs a name lookup, which /etc/hosts refuses - but a
# packet of a connection pf holds no state for (opened before the lock) is dropped, and QUIC (UDP 443)
# is dropped so browsers fall back to TCP. "quick": these decide, nothing after them is consulted.
table <lq_warm> persist
pass out quick proto tcp to <lq_warm> flags S/SA keep state
block drop out quick proto tcp to <lq_warm>
block drop out quick proto udp to <lq_warm> port 443

# Block common VPN protocols as a backup to closing the VPN apps: WireGuard, OpenVPN, IKEv2/IPsec.
block drop out proto udp to any port 51820
block drop out proto udp to any port 1194
block drop out proto tcp to any port 1194
block drop out proto udp to any port 500
block drop out proto udp to any port 4500
