# LOCKqz pf firewall backup layer. Loaded into anchor "com.lockqz" during a quiz.
# Primary blocking is /etc/hosts; this closes the browser-own-encrypted-DNS hole
# and a few hardcoded resolver IPs. install.sh adds `anchor "com.lockqz"` to
# /etc/pf.conf so these rules are evaluated.

# Block DNS-over-TLS everywhere (port 853) so encrypted DNS can't bypass hosts.
block drop out proto tcp to any port 853
block drop out proto udp to any port 853

# Block known public DoH resolver IPs on 443, TCP and UDP (DNS over HTTP/3), IPv4 and IPv6 - the
# same list as the Windows engine (browsers fall back to OS DNS = hosts): Cloudflare 1.1.1.1 + the
# Firefox/Chrome endpoints, Google, Quad9, OpenDNS, AdGuard, Mullvad, Control D,
# CIRA Shield, Wikimedia DNS, AliDNS, DNSPod. One plain rule per address (same form as below).
block drop out proto tcp to 1.1.1.1 port 443
block drop out proto udp to 1.1.1.1 port 443
block drop out proto tcp to 1.0.0.1 port 443
block drop out proto udp to 1.0.0.1 port 443
block drop out proto tcp to 8.8.8.8 port 443
block drop out proto udp to 8.8.8.8 port 443
block drop out proto tcp to 8.8.4.4 port 443
block drop out proto udp to 8.8.4.4 port 443
