# LOCKqz pf firewall backup layer. Loaded into anchor "com.lockqz" during a quiz.
# Primary blocking is /etc/hosts; this closes the browser-own-encrypted-DNS hole
# and a few hardcoded resolver IPs. install.sh adds `anchor "com.lockqz"` to
# /etc/pf.conf so these rules are evaluated.

# Block DNS-over-TLS everywhere (port 853) so encrypted DNS can't bypass hosts.
block drop out proto tcp to any port 853
block drop out proto udp to any port 853

# Block known public DoH resolver IPs on 443 (browsers fall back to OS DNS = hosts).
block drop out proto tcp to 1.1.1.1 port 443
block drop out proto tcp to 1.0.0.1 port 443
block drop out proto tcp to 8.8.8.8 port 443
block drop out proto tcp to 8.8.4.4 port 443
block drop out proto tcp to 9.9.9.9 port 443
block drop out proto tcp to 149.112.112.112 port 443

# Block local AI model servers on loopback + LAN (Ollama, LM Studio, GPT4All, Jan, llama.cpp,
# text-gen-webui, LocalAI, vLLM) so a model running on the student's own machine is unreachable.
block drop out proto tcp to any port 11434
block drop out proto tcp to any port 1234
block drop out proto tcp to any port 4891
block drop out proto tcp to any port 1337
block drop out proto tcp to any port 8080
block drop out proto tcp to any port 7860
block drop out proto tcp to any port 5000
block drop out proto tcp to any port 8000

# Block common VPN protocols as a backup to closing the VPN apps: WireGuard, OpenVPN, IKEv2/IPsec.
block drop out proto udp to any port 51820
block drop out proto udp to any port 1194
block drop out proto tcp to any port 1194
block drop out proto udp to any port 500
block drop out proto udp to any port 4500
