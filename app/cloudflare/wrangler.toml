name = "lockqz"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

# D1 database binding (the API uses env.DB).
# Create it once:  wrangler d1 create lockqz   then paste the id below.
[[d1_databases]]
binding = "DB"
database_name = "lockqz"
database_id = "02a0c476-d6b7-4bd4-8c59-2ddef91ad8a3"

# Set the teacher key as a secret (not here):
#   wrangler pages secret put TEACHER_KEY

# Device auth is enforced in production by the Pages SECRET REQUIRE_SIGNED=1 (set in Cloudflare;
# do not also list it here -- a var and a secret with one name fail the deploy).
# Email codes: secrets MAIL_USER + MAIL_APP_PASSWORD (Gmail app password, the fallback sender).
# High-volume email: Amazon SES secrets SES_ACCESS_KEY_ID, SES_SECRET_ACCESS_KEY, MAIL_FROM, SES_REGION, SES_DAILY_MAX
# (put there by CI from GitHub secrets/variables: app/payments/mail-setup.sh). Not set = Gmail only.
# Optional: ROT_SECRET as a secret for rotating-code derivation; the API falls back to TEACHER_KEY.
[vars]
ADMIN_EMAIL = "athall@usc.edu"
# LOCKqz addresses on this same Pages production that answer API calls themselves (no forward to lockqz.pages.dev).
API_DIRECT = "lockqz.com,www.lockqz.com"
# Google sign-in (Google Identity Services, no secret): the OAuth client ID of project lockqz-513313
# (Web, JavaScript origins https://lockqz.com, https://professor.lockqz.com, https://lockqz.pages.dev, https://prof.lockqz.pages.dev). Empty = email codes only.
GOOGLE_CLIENT_ID = "974814794609-d9bcg7hjghna4tr7274uj6bdbpm069j7.apps.googleusercontent.com"
# Students must sign in with this Google domain (empty = any verified Google email).
GOOGLE_HD = "usc.edu"
ZELLE_TO = "(858) 900-4347"
# A Zelle or Venmo with no memo: counted for a student when it is exactly the student price and the payer's
# name is the Brightspace name of exactly one student who has not paid this term (tagged "[name match]" in
# Admin -> Payments). Anything less certain waits for the admin as before. "0" = off: the memo is needed.
PAY_NAME_MATCH = "1"
VENMO_HANDLE = "LOCKqz"
INVOICE_EMAIL = "support@lockqz.com"
# Replies to LOCKqz emails go here (Cloudflare Email Routing forwards *@lockqz.com to lockqz.app@gmail.com).
MAIL_REPLY_TO = "support@lockqz.com"
# From address on LOCKqz emails: a "Send mail as" alias on the Gmail that sends them (lockqz.app@gmail.com, verified 1 Nov 2026).
# MAIL_FROM_ADDR = "support@lockqz.com"   # OFF: USC mail (Proofpoint) held mail From the brand-new lockqz.com (1 Nov 2026); retry once the domain is a few weeks old.
# Email From an address on lockqz.com, signed by lockqz.com (Resend; Pages secret RESEND_API_KEY turns it on; free 100 a day).
RESEND_FROM = "support@lockqz.com"
# First inbox checks: only email to these addresses goes through Resend. Empty = every LOCKqz email.
RESEND_TEST_TO = ""
# Second sender From the same address (SMTP2GO; Pages secret SMTP2GO_API_KEY turns it on): free 200 a day,
# 1,000 a month from the account's billing day. Used when Resend's day is full or Resend refuses.
SMTP2GO_CYCLE_DAY = "15"
# Third sender From the same address (Mailjet; Pages secrets MAILJET_API_KEY + MAILJET_SECRET_KEY turn it on): free 200 a day,
# 6,000 a calendar month. Used when Resend and SMTP2GO are full or refuse.
# On since 18 Nov 2026 (domain validated, SPF + DKIM records in place).
# "1" = sign-in codes go through Resend / SMTP2GO too (while RESEND_TEST_TO lists addresses: only codes to those).
RESEND_CODES = "1"
# "1" = when Resend and SMTP2GO are full or refuse, the email goes out from the Gmail address instead of waiting ("0" = it waits).
GMAIL_BACKUP = "1"
# Fewer emails (owner, 18 Nov 2026): no welcome email at professor sign-up; one install reminder per exam, not two.
WELCOME_MAIL = "0"
EXAM_REMIND_3H = "0"
# Automatic email to students (exam reminders, renewal and pay reminders, card renewals) only from a class LOCKqz is
# on for (owner, 22 Nov 2026). "0" or absent = as before.
STUDENT_MAIL_ON = "1"
# Professors whose classes get no automatic student email until the professor emails the class himself (Email students
# on the dashboard; owner, 22 Nov 2026). Comma-separated. test_mail_on holds these two lines.
MAIL_HOLD = "dbristow@usc.edu,dbristow@marshall.usc.edu"
# Student fee per semester (USD) and the date it starts (YYYY-MM-DD; empty = off).
STUDENT_FEE = "180"
# The "One step left: pay for LOCKqz" email, hours after an install (0 = off). Off (Anthony, 13 Nov 2026): from 0.6.22 the
# app opens the student's pay page by itself right after setup, so that email would only spend the daily email allowance.
PAY_NUDGE_HOURS = "0"
STUDENT_FEE_FROM = "2026-10-25"
# Venmo for students on (Anthony, 26 Oct); its price is STUDENT_OTHER_PRICE (+ income tax).
STUDENT_VENMO = "1"
# Business checking: once it is open, put its Zelle email/phone here; students are then shown it
# instead of ZELLE_TO, and its bank's alerts must reach the Gmail that runs LOCKqz-payments.gs.
ZELLE_BUSINESS_TO = ""
# Stripe (card + US bank account). Off until both Pages secrets are set: STRIPE_SECRET_KEY (sk_live_...)
# and STRIPE_WEBHOOK_SECRET (whsec_...; webhook https://lockqz.pages.dev/api/pay/stripe/webhook, events
# checkout.session.completed, checkout.session.async_payment_succeeded, charge.refunded, charge.dispute.created).
# Prices carry Stripe's fee (card 2.9% + 30c, bank 0.8% capped $5) so LOCKqz nets at least the base price.
STUDENT_CARD_PRICE = "210"
STUDENT_BANK_PRICE = "181.45"
PROF_CARD_PRICE = "5150"
PROF_BANK_PRICE = "5005"
# Income tax on top of every price from TAX_FROM on: price = base / (1 - TAX_RATE); the payer sees it as its own
# "Tax & fees (25%)" line when they pick how to pay. Zelle / bank transfer base = STUDENT_FEE ($180) and $5,000;
# Venmo / PO / card base = STUDENT_OTHER_PRICE / STUDENT_CARD_PRICE ($200) for students. TAX_FROM empty = off.
# The line's name is the code's own ("Tax & fees", [[route]].js taxInfo): Workers Free takes 64 variables per Worker.
TAX_RATE = "0.25"
TAX_FROM = "2026-10-26T13:00:00Z"
STUDENT_OTHER_PRICE = "210"
# Whole-number totals people see (tax & fees = TAX_RATE of these). Students (Anthony, 8 Nov 2026): $200 by Zelle or
# bank transfer (STUDENT_TOTAL), $210 by card, Venmo or PO (STUDENT_OTHER_TOTAL). A card / Venmo / PO payment received
# before STUDENT_OTHER_FROM counts against STUDENT_OTHER_TOTAL_PREV (the $200 in force 2-8 Nov), so nobody loses access.
STUDENT_TOTAL = "200"
# Student payment options (pay page order: Card, Venmo, Zelle, then bank transfer). "1" would hide everything but card.
STUDENT_CARD_ONLY = "0"
STUDENT_OTHER_TOTAL = "210"
STUDENT_OTHER_TOTAL_PREV = "200"
STUDENT_OTHER_FROM = "2026-11-08T20:00:00Z"
# Professors (Anthony, 8 Nov 2026): $6,300 by Zelle; $6,500 by bank transfer, Venmo or card. No purchase orders.
PROF_TOTAL = "6500"
PROF_CARD_TOTAL = "6500"
PROF_ZELLE_TOTAL = "6300"
PROF_BANK_TOTAL = "6500"
PROF_OTHER_PRICE = "5000"
# Bank transfer details emailed automatically: Pages SECRET BANK_DETAILS (bank, account holder, routing, account).
# Stripe bank account (ACH) off: consumers can return ACH debits for 60 days. "1" turns it on.
STRIPE_BANK = "0"
# Student card auto-renew: a student card payment saves the card and renews each Fall/Spring off-session (charged
# on the first day a payment counts for the next term, after a reminder email 7 days before). "0" = one-time cards.
# RENEW_MAIL_DAY_MAX = renewal reminder emails per day (Gmail's send limit is shared with the email codes).
STUDENT_AUTORENEW = "1"
RENEW_MAIL_DAY_MAX = "150"
# Trial testers: never pay (student or professor fee) and get the test-run welcome. Comma-separated.
FEE_EXEMPT = ""
# Free forever (owner, 19 Nov 2026): never pay (student or professor fee), no trial, no end date. Comma-separated.
# Not part of the trial list above: ending the trial leaves these as they are. test_sweep4 holds this line.
FREE_FOREVER = "dbristow@usc.edu,dbristow@marshall.usc.edu,huutienn@usc.edu,jscohen@usc.edu,abbati@usc.edu"
# Every LOCKqz-protected quiz is gated: the professor's Sync tab hides it and admits only students LOCKqz is
# locking (it starts the gate by itself from 1 h before the start), and no password is given for an
# ungated protected quiz until it ends (the professor is emailed to open the Sync tab). "0" = off.
# Off (owner, 19 Nov 2026): one LOCKqz password per quiz for the whole quiz, written at Sync and given only to a
# computer LOCKqz is locking. Nothing has to stay open on the professor's side on exam day.
REQUIRE_GATE = "0"
# Exam rules (27 Nov 2026): the professor chooses what students may use in each exam (dashboard: the pill under the
# exam), and /password sends those rules to the app. "0" until every app understands them, then "1".
RULES_ON = "0"

# Brightspace's own submission email (22 Nov 2026): the Sync adds LOCKqz's address for each protected quiz
# (quiz+<ou>-<qi>-<tok>@lockqz.com) to its Notification Email, beside the professor's own; LOCKqz's Email Worker
# (app/mailin; Email Routing rule quiz@lockqz.com, subaddressing on) hands each email to /api/mailin, which records
# the submission (AI back at once on a held computer) and tells the professor of a submit without LOCKqz.
# "0" = off: the Sync leaves Notification Email alone. Only exams that are not over, in classes LOCKqz is on for.
MAILIN_ON = "1"
# Email to support@lockqz.com and the catch-all goes through the same Worker to the mailbox; when the mailbox turns it
# away for a while, the Worker hands it to /api/mailfwd and LOCKqz sends it on (Pages secret MAILIN_KEY, the Worker's
# own secret of the same value; at most MAILFWD_DAY_MAX, 40, a day).

# Exam emails (27 Oct 2026): reminders 48 h / 3 h before each protected exam to students without LOCKqz, and
# the professor's T-70 check-in, run by POST /api/cron (X-LOCKqz-Pay). Cloudflare Pages Functions have no
# [triggers] crons (Workers only), so the Gmail script (app/payments/LOCKqz-payments.gs, every minute) calls
# /api/cron every ~10 min and /api/pay/tick hourly runs the same tick. $0, nothing to deploy.
