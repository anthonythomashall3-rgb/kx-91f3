name = "lockqz"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

# D1 database binding (the API uses env.DB).
# Create it once:  wrangler d1 create lockqz   then paste the id below.
[[d1_databases]]
binding = "DB"
database_name = "lockqz"
database_id = "02a0c476-d6b7-4bd4-8c59-2ddef91ad8a3"

# Set the teacher key as a secret (not here):
#   wrangler pages secret put TEACHER_KEY

# Device auth is enforced in production by the Pages SECRET REQUIRE_SIGNED=1 (set in Cloudflare;
# do not also list it here -- a var and a secret with one name fail the deploy).
# Email codes: secrets MAIL_USER + MAIL_APP_PASSWORD (Gmail app password).
# Optional: ROT_SECRET as a secret for rotating-code derivation; the API falls back to TEACHER_KEY.
[vars]
ADMIN_EMAIL = "athall@usc.edu"
ZELLE_TO = "(858) 900-4347"
VENMO_HANDLE = "LOCKqz"
INVOICE_EMAIL = "lockqz.app@gmail.com"
# Student fee per semester (USD) and the date it starts (YYYY-MM-DD; empty = off).
STUDENT_FEE = "180"
STUDENT_FEE_FROM = "2026-10-25"
# Students pay by Zelle or bank transfer only (no fees). Venmo for students: STUDENT_VENMO = "1".
# Business checking: once it is open, put its Zelle email/phone here; students are then shown it
# instead of ZELLE_TO, and its bank's alerts must reach the Gmail that runs LOCKqz-payments.gs.
ZELLE_BUSINESS_TO = ""
# Stripe (card + US bank account). Off until both Pages secrets are set: STRIPE_SECRET_KEY (sk_live_...)
# and STRIPE_WEBHOOK_SECRET (whsec_...; webhook https://lockqz.pages.dev/api/pay/stripe/webhook, events
# checkout.session.completed, checkout.session.async_payment_succeeded, charge.refunded, charge.dispute.created).
# Prices carry Stripe's fee (card 2.9% + 30c, bank 0.8% capped $5) so LOCKqz nets at least the base price.
STUDENT_CARD_PRICE = "200"
STUDENT_BANK_PRICE = "181.45"
PROF_CARD_PRICE = "5150"
PROF_BANK_PRICE = "5005"
# Stripe bank account (ACH) off: consumers can return ACH debits for 60 days. "1" turns it on.
STRIPE_BANK = "0"
# Trial testers: never pay (student or professor fee) and get the test-run welcome. Comma-separated.
FEE_EXEMPT = "dbristow@usc.edu,dbristow@marshall.usc.edu,huutienn@usc.edu"
# Every LOCKqz-protected quiz is gated: the professor's Sync tab hides it and admits only students LOCKqz is
# locking (it starts the gate by itself from 1 h before the start), and no password is given for an
# ungated protected quiz until it ends (the professor is emailed to open the Sync tab). "0" = off.
REQUIRE_GATE = "1"
