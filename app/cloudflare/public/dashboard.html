<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOCKqz</title>
<style>
  :root{--usc:#990000;--ink:#1a1a1a;--mute:#5c5952;--faint:#8a877f;--line:#e6e3dc;--bg:#f6f5f2;--ok:#1a7f37;--okbg:#e3f3e8;--warn:#b45309;--warnbg:#fff6e8;--warnline:#f3dcb3;--off:#c9c5bb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,Segoe UI,system-ui,sans-serif}
  a{color:var(--usc);text-decoration:none}a:hover{text-decoration:underline}
  button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0}
  input{font:inherit}
  .hide{display:none!important}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 32px;background:#fff;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .brand:hover{text-decoration:none}
  .menu{position:relative}
  .menu>summary{list-style:none;display:flex;align-items:center;gap:8px;font-weight:500;padding:10px 4px;min-height:44px;cursor:pointer}
  .menu>summary::-webkit-details-marker{display:none}
  .menu>div{position:absolute;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);min-width:230px;padding:6px;z-index:10;display:flex;flex-direction:column}
  .menu>div button,.menu>div a{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;color:var(--ink);font-size:14px}
  .menu>div button:hover,.menu>div a:hover{background:var(--bg);text-decoration:none}
  main{width:100%;max-width:1040px;margin:0 auto;padding:32px 24px 56px;display:flex;flex-direction:column;gap:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 28px}
  .band{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px}
  .band h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
  .sub{margin:4px 0 0;color:var(--mute);font-size:15px}
  .orb{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--okbg)}
  .orb.off{background:#f1efe9}
  .sw{display:flex;align-items:center;gap:10px;padding:6px;min-height:44px}
  .sw b{font-size:14px;font-weight:600}
  .sw i{position:relative;width:48px;height:28px;border-radius:14px;background:var(--off);display:inline-block;transition:background .2s;flex-shrink:0}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
  .sw[aria-pressed=true] i{background:var(--ok)}.sw[aria-pressed=true] i::after{left:23px}
  .sw.big i{width:56px;height:32px;border-radius:16px}.sw.big i::after{width:26px;height:26px}.sw.big[aria-pressed=true] i::after{left:27px}
  .sw:disabled{opacity:.5;cursor:wait}
  .eyebrow{margin:0 0 -6px 4px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b6861}
  .cls{display:flex;flex-direction:column;gap:20px}
  .cls.off{opacity:.72}
  .cls .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .cls .top a{display:flex;flex-direction:column;gap:2px;color:var(--ink);min-width:0}
  .cls .top a:hover{text-decoration:none}.cls .top a:hover span:first-child{text-decoration:underline}
  .cls .top .nm{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .cls .top .sm{font-size:14px;color:#6b6861}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  @media(max-width:700px){.tiles{grid-template-columns:1fr}}
  .tile{background:#faf9f6;border:1px solid #ebe8e1;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
  .tile .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b6861}
  .tile .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .tile .v small{font-size:16px;font-weight:500;color:#6b6861}
  .tile .v.md{font-size:18px;line-height:1.2;letter-spacing:-.01em}
  .tile .n{font-size:13px;color:#6b6861}
  .bar{display:block;height:6px;border-radius:3px;background:#ebe8e1;overflow:hidden}.bar span{display:block;height:6px;background:var(--ok);border-radius:3px}
  .note{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:12px 16px;border-radius:10px;font-size:14px}
  .note.warn{background:var(--warnbg);border:1px solid var(--warnline);color:#6a4a00}
  .note.ok{background:var(--okbg);border:1px solid #bfe3c9;color:#0f5a25}
  .note.red{background:#fff1f1;border:1px solid #f0c4c4;color:var(--usc)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:10px 14px;min-height:44px;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none!important}
  .btn.warn{border-color:#d9b26b;color:#6a4a00}
  .btn.prime{background:var(--usc);border-color:var(--usc);color:#fff}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn:disabled{opacity:.5;cursor:wait}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;min-height:44px;align-self:flex-start}
  .two{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .two>section{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px}
  .two h2{margin:0;font-size:17px;font-weight:700}
  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.hrow span{font-size:13px;color:#6b6861}
  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  ul.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #efece6}
  ul.list .grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
  ul.list .t{font-size:15px;font-weight:600}ul.list .d{font-size:13px;color:#6b6861}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--off)}
  .dot.ok{background:var(--ok)}.dot.warn{background:#d97706}.dot.red{background:var(--usc)}
  .st{font-size:13px;font-weight:500;color:#6b6861;white-space:nowrap}.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.red{color:var(--usc);font-weight:700}
  .more{font-size:13px;color:var(--faint);text-align:center;padding-top:8px}
  .foot{margin:0 4px;font-size:13px;color:var(--faint)}
  .counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  @media(max-width:700px){.counts{grid-template-columns:1fr}}
  .count{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
  .count .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b6861}
  .count .v{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .count.ok .v{color:var(--ok)}.count.red{border:2px solid var(--usc)}.count.red .k,.count.red .v{color:var(--usc)}
  li.flag{background:#fff1f1;margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:8px}
  .pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--okbg);display:inline-block}
  /* login */
  .gate{min-height:calc(100vh - 73px);display:flex;align-items:center;justify-content:center;padding:40px 24px}
  .gate .card{width:100%;max-width:460px;padding:44px 40px;display:flex;flex-direction:column;gap:18px;text-align:center}
  .gate h1{margin:0;font-size:22px;font-weight:700}
  .gate p{margin:0;color:var(--mute)}
  .gate input{width:100%;padding:12px 14px;border:1px solid #cfccc4;border-radius:10px;font-size:16px}
  .gate .btn.prime{width:100%;min-height:52px;font-size:16px;border-radius:12px}
  .err{color:var(--usc);font-size:14px}
  .muted{color:var(--mute);font-size:14px}
  .bmk{display:inline-flex;align-items:center;gap:8px;background:var(--usc);color:#fff!important;font-weight:700;padding:12px 18px;border-radius:10px;cursor:grab;text-decoration:none!important}
  ol.steps{margin:0;padding-left:22px;line-height:1.9;color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #efece6;padding:8px;text-align:left;vertical-align:top}
  code{background:#f3f1ec;padding:2px 7px;border-radius:5px;font-size:13px;user-select:all}
  details.past summary{cursor:pointer;font-size:14px;color:var(--mute);padding:10px 0}
</style></head>
<body>
<header>
  <a class="brand" href="#" onclick="nav('');return false"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#990000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>LOCKqz</a>
  <details class="menu hide" id="menu">
    <summary id="who">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6861" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </summary>
    <div>
      <button onclick="nav('connect')">Brightspace connection</button>
      <button onclick="nav('activity')">Activity log</button>
      <button id="m-admin" class="hide" onclick="nav('admin')">Admin</button>
      <button onclick="changePw()">Change password</button>
      <button onclick="logout()">Log out</button>
    </div>
  </details>
</header>

<!-- ============ LOGIN ============ -->
<div id="login" class="gate">
  <div class="card">
    <div class="brand" style="justify-content:center;font-size:26px"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#990000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>LOCKqz</div>
    <div><h1 id="ltitle">No AI during your exams.</h1><p id="lsub">Sign in. Your classes, rosters and exams come from Brightspace by themselves.</p></div>
    <input id="name" placeholder="Your name" class="hide" autocomplete="name">
    <input id="email" type="email" placeholder="USC email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button id="lbtn" class="btn prime" onclick="go()">Sign in</button>
    <div class="err" id="lerr"></div>
    <div class="muted hide" id="signuprow"><a href="#" id="lswitch" onclick="toggle();return false">New here? Create an account</a></div>
    <div class="muted" id="forgotrow"><a href="#" onclick="showForgot();return false">Forgot password?</a></div>
    <div id="forgot" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <input id="femail" type="email" placeholder="Your account email">
      <button class="btn" onclick="requestReset()">Request password reset</button>
      <div class="muted" id="fmsg"></div>
    </div>
    <p class="muted" style="font-size:13px"><a href="/privacy.html">Privacy</a></p>
  </div>
</div>

<!-- ============ APP ============ -->
<main id="app" class="hide"></main>

<script>
const API = "/api", INSTALL = "https://lockqz.pages.dev";
let token = localStorage.getItem("lockqz_token") || "";
let signup = false, ME = null, BS = { courses: [] }, LEGACY = [], SYNCKEY = "", liveTimer = null, INVITE = "";
const $ = id => document.getElementById(id);
const H = () => ({ "X-LOCKqz-Teacher": token, "Content-Type":"application/json" });
const get  = async p => (await fetch(API+p,{headers:H()})).json();
const post = async (p,b) => (await fetch(API+p,{method:"POST",headers:H(),body:JSON.stringify(b||{})})).json();
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = t => t ? new Date(t).toLocaleString([], {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
const ago = t => { if(!t) return "never"; const m=Math.round((Date.now()-Date.parse(t))/60000); return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"; };
const cname = c => String(c.name||c.ou).replace(/^\d+_\w+\s*/,"");
const SHIELD = (c,s) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>`;
const BACK = (to,label) => `<a class="back" href="#" onclick="nav('${to}');return false"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>${label}</a>`;

// ---- login (unchanged behaviour) ----
function toggle(){ signup=!signup; $("name").classList.toggle("hide",!signup); $("ltitle").textContent=signup?"Create your professor account":"No AI during your exams.";
  $("lbtn").textContent=signup?"Create account":"Sign in"; $("lswitch").textContent=signup?"Already have an account? Sign in":"New here? Create an account"; $("lerr").textContent="";
  $("forgotrow").classList.toggle("hide", signup); $("forgot").classList.add("hide"); }
async function go(){
  $("lerr").textContent="";
  const d = await post(signup?"/signup":"/login",{email:$("email").value,password:$("pw").value,name:$("name").value,invite:INVITE});
  if(d.error){ $("lerr").textContent = signup ? d.error : "Incorrect email or password."; return; }
  token=d.token; localStorage.setItem("lockqz_token",token);
  if(INVITE){ INVITE=""; history.replaceState(null,"",location.pathname); }
  boot();
}
function showForgot(){ $("forgot").classList.remove("hide"); $("femail").value=$("email").value||""; $("fmsg").textContent=""; }
async function requestReset(){ const email=$("femail").value.trim(); if(!email){ $("fmsg").textContent="Enter your email."; return; }
  await post("/forgot",{email}); $("fmsg").textContent="If that account exists, your LOCKqz admin has been notified and will give you a new password."; }
async function changePw(){ const pw = prompt("Enter a new password (at least 8 characters):"); if(pw===null) return;
  if(pw.length<8){ alert("Password must be at least 8 characters."); return; }
  const d = await post("/changepw",{password:pw}); alert(d.error ? d.error : "Password changed."); }
["email","pw","name"].forEach(i=>$(i).addEventListener("keydown",e=>{ if(e.key==="Enter") go(); }));
async function logout(){ await post("/logout"); token=""; localStorage.removeItem("lockqz_token"); location.hash=""; location.reload(); }

// ---- boot ----
async function boot(){
  if(!token) return;
  const m = await get("/me");
  if(m.error){ token=""; localStorage.removeItem("lockqz_token"); return; }
  ME = m;
  $("login").classList.add("hide"); $("app").classList.remove("hide"); $("menu").classList.remove("hide");
  $("who").insertAdjacentHTML("afterbegin", esc(m.name||m.email));
  if(m.admin) $("m-admin").classList.remove("hide");
  await refresh(); route();
  setInterval(async()=>{ if(!location.hash.startsWith("#live")) { await refresh(); route(); } }, 60000);
}
async function refresh(){
  const [b,q,k] = await Promise.all([get("/bs"), get("/quizzes"), SYNCKEY?{key:SYNCKEY}:get("/synckey")]);
  BS = b.courses ? b : { courses: [] };
  LEGACY = (q.quizzes||[]).filter(x=>!x.ou);              // quizzes added by link in the old UI, not from Brightspace
  if(k.key) SYNCKEY = k.key;
}
function nav(h){ location.hash = h; }
window.addEventListener("hashchange", route);
document.addEventListener("click", e=>{ const m=$("menu"); if(m && !m.contains(e.target)) m.removeAttribute("open"); });

// ---- derived state ----
const now = () => Date.now();
const live = q => q.password && q.start_date && Date.parse(q.start_date) <= now() && (!q.end_date || Date.parse(q.end_date) > now()) && (!q.start_date || now() - Date.parse(q.start_date) < 6*3600e3);
const ended = q => (q.end_date && Date.parse(q.end_date) < now()) || (q.due_date && !q.end_date && Date.parse(q.due_date) < now() - 86400e3);
const current = c => c.quizzes.filter(q => q.active !== 0 && !ended(q));
const pendingSync = () => BS.courses.some(c => c.quizzes.some(q => q.password && !q.bs_password_is_ours));
function classStats(c){
  const cur = current(c), prot = cur.filter(q=>q.password), ready = c.students.filter(s=>s.installed).length;
  const next = cur.filter(q=>q.start_date && Date.parse(q.start_date) > now()).sort((a,b)=>Date.parse(a.start_date)-Date.parse(b.start_date))[0];
  return { cur, prot, ready, next, missing: c.students.filter(s=>!s.installed), on: cur.length ? prot.length>0 : true, inprog: cur.filter(live) };
}

// ---- router ----
function route(){
  if(!ME) return;
  if(liveTimer){ clearInterval(liveTimer); liveTimer=null; }
  $("menu").removeAttribute("open");
  const h = location.hash.replace(/^#/,""), [v,a] = h.split("/");
  const app = $("app");
  if(v==="class" && a) return app.innerHTML = viewClass(a);
  if(v==="live" && a) { app.innerHTML = viewLive(a); loadLive(a); liveTimer = setInterval(()=>loadLive(a), 10000); return; }
  if(v==="connect") return app.innerHTML = viewConnect();
  if(v==="activity") { app.innerHTML = viewActivity(); loadSessions(); return; }
  if(v==="admin" && ME.admin) { app.innerHTML = viewAdmin(); loadTeachers(); loadInvites(); loadPayments(); return; }
  app.innerHTML = viewHome(); loadPay();
}

// ---- HOME ----
function viewHome(){
  let h = "";
  h += `<div id="pay"></div>`;
  if(!BS.courses.length) return h + viewConnect(true);
  const all = BS.courses.map(classStats);
  const exams = all.reduce((n,s)=>n+s.cur.length,0), prot = all.reduce((n,s)=>n+s.prot.length,0), students = BS.courses.reduce((n,c)=>n+c.students.length,0);
  const allOn = exams>0 && prot===exams, allOff = prot===0;
  const synced = BS.courses.map(c=>c.synced_at).sort().pop();
  const inprog = all.flatMap(s=>s.inprog.map(q=>({q, c: BS.courses[all.indexOf(s)]})));
  const headline = exams===0 ? "No upcoming exams in Brightspace yet." : allOff ? "LOCKqz is off. Students can use AI during your exams." : allOn ? `LOCKqz is on for all ${exams} of your upcoming exam${exams===1?"":"s"}.` : `LOCKqz is on for ${prot} of your ${exams} upcoming exams.`;
  h += `<section class="card band" aria-label="Status">
    <div style="display:flex;align-items:center;gap:20px;min-width:0">
      <div class="orb ${allOff?'off':''}">${SHIELD(allOff?'#6b6861':'#1a7f37',30)}</div>
      <div><h1>${headline}</h1><p class="sub">Synced with Brightspace ${ago(synced)} · ${BS.courses.length} class${BS.courses.length===1?"":"es"} · ${students} students${pendingSync()?"":" · nothing for you to do"}</p></div>
    </div>
    ${exams ? `<button class="sw big" aria-pressed="${!allOff}" aria-label="LOCKqz on for all exams" onclick="setAll(${allOff})"><b>${allOff?"Off":"On"}</b><i></i></button>` : ""}
  </section>`;
  if(pendingSync()) h += `<div class="note warn"><span>One more click: open Brightspace and press your <b>LOCKqz Sync</b> bookmark so Brightspace matches these settings.</span><button class="btn warn" onclick="nav('connect')">How</button></div>`;
  inprog.forEach(({q,c}) => h += `<div class="note ok"><span style="display:flex;align-items:center;gap:10px"><span class="pulse"></span><b>${esc(q.name)}</b> is in progress · ${esc(cname(c))}</span><a class="btn ok" href="#live/${esc(c.ou)}-${esc(q.qi)}">Watch live</a></div>`);
  h += `<section aria-label="Your classes" style="display:flex;flex-direction:column;gap:16px"><h2 class="eyebrow">Your classes</h2>`;
  BS.courses.forEach((c,i) => {
    const s = all[i], pct = c.students.length ? Math.round(100*s.ready/c.students.length) : 0;
    h += `<article class="card cls ${s.on?'':'off'}">
      <div class="top">
        <a href="#class/${esc(c.ou)}"><span class="nm">${esc(cname(c))}</span><span class="sm">${esc(c.code||"")}${c.code?" · ":""}${c.students.length} students</span></a>
        ${s.cur.length ? `<button class="sw" aria-pressed="${s.on}" aria-label="LOCKqz on for this class" onclick="setClass('${esc(c.ou)}',${!s.on})"><b>${s.on?"On":"Off"}</b><i></i></button>` : ""}
      </div>
      <div class="tiles">
        <div class="tile"><span class="k">Students ready</span><span class="v">${s.ready}<small> / ${c.students.length}</small></span><span class="bar"><span style="width:${pct}%"></span></span></div>
        <div class="tile"><span class="k">Exams protected</span><span class="v">${s.prot.length}<small> / ${s.cur.length}</small></span><span class="n">${s.cur.length===0?"no upcoming exams":s.on&&s.prot.length===s.cur.length?"all of them, automatically":s.on?"some turned off":"LOCKqz is off for this class"}</span></div>
        <div class="tile"><span class="k">Next exam</span><span class="v md">${s.next?esc(s.next.name):"—"}</span><span class="n">${s.next?when(s.next.start_date):"none scheduled"}</span></div>
      </div>

const LBL = {locked:["ok","Locked · working"],tamper:["red","Tampering detected — AI may be open"],helper_killed:["red","LOCKqz was stopped — AI may be open"],dark:["red","Lost contact — AI may be open"],browser_closed:["warn","Browser closed"],done:["","Submitted · unlocked"],left_early:["red","AI unblocked before submitting — verify"],developer:["","Admin (developer mode)"]};

async function loadLive(id){
  const d = await get("/live?quiz="+encodeURIComponent(id)); if(!$("lrows")) return;
  const rows = d.rows||[], [ou] = id.split("-"), c = BS.courses.find(x=>x.ou===ou);
  const seen = new Set(rows.map(r=>(r.email||r.student||"").toLowerCase()));
  const nameOf = r => { const k=(r.email||r.student||"").toLowerCase(); const s=c&&c.students.find(x=>(x.email||"").toLowerCase()===k||(x.name||"").toLowerCase()===k); return s?s.name:(r.student||r.device_id); };
  const notStarted = c ? c.students.filter(s=>!seen.has((s.email||"").toLowerCase()) && !seen.has((s.name||"").toLowerCase())) : [];
  const flagged = rows.filter(r=>LBL[r.status]&&LBL[r.status][0]==="red"), ok = rows.filter(r=>r.status==="locked"), done = rows.filter(r=>r.status==="done");
  $("lcounts").innerHTML = `<div class="count ok"><span class="k">AI blocked</span><span class="v">${ok.length}</span><span class="n">students locked and working</span></div>
    <div class="count ${flagged.length?'red':''}"><span class="k">Needs a look</span><span class="v">${flagged.length}</span><span class="n">${flagged.length?"LOCKqz stopped or tampered mid-exam":"nothing unusual"}</span></div>
    <div class="count"><span class="k">${c?"Not started":"Finished"}</span><span class="v">${c?notStarted.length:done.length}</span><span class="n">${c?"have not opened the exam":"submitted and unlocked"}</span></div>`;
  const order = r => r.status==="done"?3:LBL[r.status]&&LBL[r.status][0]==="red"?0:r.status==="browser_closed"?1:2;
  const list = rows.sort((a,b)=>order(a)-order(b)).map(r=>{ const [k,l]=LBL[r.status]||["",r.status]; const t=(r.age_ms==null||r.status==="done")?"":Math.round(r.age_ms/1000)+" s";
    return `<li class="${k==='red'?'flag':''}"><span class="dot ${k}"></span><span class="grow"><span style="font-size:15px;font-weight:${k==='red'?700:500}">${esc(nameOf(r))}</span></span><span class="st ${k}">${l}</span><span class="st" style="min-width:48px;text-align:right">${t}</span></li>`; })
    .concat(notStarted.map(s=>`<li><span class="dot"></span><span class="grow"><span style="font-size:15px">${esc(s.name)}</span></span><span class="st">Has not opened the exam</span><span class="st" style="min-width:48px"></span></li>`));
  $("lrows").innerHTML = list.join("") || `<li class="d">No students have opened this exam yet.</li>`;
  $("lsub").textContent = ($("lsub").textContent.split("·")[0].includes("Started")?$("lsub").textContent.split("·")[0]+"· ":"") + "updated " + new Date().toLocaleTimeString();
}

    + "2. Drag the LOCKqz Sync button to your bookmarks bar and click it once in Brightspace. Your classes and exams fill in; every exam is protected automatically.\n\n"
    + "3. Students install LOCKqz once from " + INSTALL + " (the dashboard emails the ones who haven't).\n\nAnthony Hall\nLOCKqz";
  return "mailto:" + (email||"") + "?subject=" + encodeURIComponent(s) + "&body=" + encodeURIComponent(b);
}
async function makeInvite(){ const d = await post("/invite",{email:$("iemail").value,until:$("iuntil").value||semEnd()}); if(d.error){ alert(d.error); return; }
  window._ilink = inviteLink(d.code); window._imail = inviteMail(d.email, window._ilink);
  $("newinvite").innerHTML = `<div class="note ok" style="margin-top:10px"><span>Invite link (works once): <code>${esc(window._ilink)}</code></span><span style="display:flex;gap:8px"><button class="btn" onclick="navigator.clipboard.writeText(window._ilink);this.textContent='Copied'">Copy link</button><button class="btn prime" onclick="location.href=window._imail">Email it</button></span></div>`;
  $("iemail").value=""; loadInvites(); }
async function loadInvites(){ const d = await get("/invites"); const tb=document.querySelector("#invites tbody"); if(!tb) return; tb.innerHTML="";
  (d.invites||[]).forEach(i=>tb.insertAdjacentHTML("beforeend",`<tr style="${i.used_at?'color:#888':''}"><td>${esc(i.email||"(anyone with link)")}</td><td>${esc(i.active_until||"—")}</td><td>${when(i.created_at)}</td><td>${i.used_at?"joined":"pending"}</td><td>${i.used_at?"":`<button class="btn" style="min-height:32px;padding:4px 10px" onclick="cancelInvite('${esc(i.code)}')">Cancel</button>`}</td></tr>`));
  if(!(d.invites||[]).length) tb.innerHTML=`<tr><td colspan="5" class="muted">No invites yet.</td></tr>`; }
async function cancelInvite(code){ if(!confirm("Cancel this invite?")) return; const d=await post("/uninvite",{code}); if(d.error){ alert(d.error); return; } if((window._ilink||"").endsWith("="+code)){ $("newinvite").innerHTML=""; window._ilink=window._imail=null; } loadInvites(); }

// An invite link (/?invite=CODE or /dashboard?invite=CODE) opens the sign-up form; without one, only Sign in shows.
(async function initInvite(){
  INVITE = (new URLSearchParams(location.search).get("invite")||"").trim();
  if(!INVITE) return;
  const d = await get("/invite-check?code="+encodeURIComponent(INVITE));
  if(!d.ok){ INVITE=""; $("lerr").textContent="This invite link is invalid or was already used. Ask the LOCKqz admin for a new one."; return; }
  if(!signup) toggle();
  $("signuprow").classList.remove("hide");
  if(d.email){ $("email").value=d.email; $("email").readOnly=true; }
})();

boot();
