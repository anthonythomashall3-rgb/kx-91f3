<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOCKqz</title>
<style>
  :root{--usc:#990000;--ink:#1a1a1a;--mute:#5c5952;--faint:#8a877f;--line:#e6e3dc;--bg:#f6f5f2;--ok:#1a7f37;--okbg:#e3f3e8;--warn:#b45309;--warnbg:#fff6e8;--warnline:#f3dcb3;--off:#c9c5bb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,Segoe UI,system-ui,sans-serif}
  a{color:var(--usc);text-decoration:none}a:hover{text-decoration:underline}
  button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0}
  input{font:inherit}
  .hide{display:none!important}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 32px;background:#fff;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .brand:hover{text-decoration:none}
  .menu{position:relative}
  .menu>summary{list-style:none;display:flex;align-items:center;gap:8px;font-weight:500;padding:10px 4px;min-height:44px;cursor:pointer}
  .menu>summary::-webkit-details-marker{display:none}
  .menu>div{position:absolute;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);min-width:230px;padding:6px;z-index:10;display:flex;flex-direction:column}
  .menu>div button,.menu>div a{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;color:var(--ink);font-size:14px}
  .menu>div button:hover,.menu>div a:hover{background:var(--bg);text-decoration:none}
  main{width:100%;max-width:1040px;margin:0 auto;padding:32px 24px 56px;display:flex;flex-direction:column;gap:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 28px}
  .band{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px}
  .band h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
  .sub{margin:4px 0 0;color:var(--mute);font-size:15px}
  .orb{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--okbg)}
  .orb.off{background:#f1efe9}
  .sw{display:flex;align-items:center;gap:10px;padding:6px;min-height:44px}
  .sw b{font-size:14px;font-weight:600}
  .sw i{position:relative;width:48px;height:28px;border-radius:14px;background:var(--off);display:inline-block;transition:background .2s;flex-shrink:0}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
  .sw[aria-pressed=true] i{background:var(--ok)}.sw[aria-pressed=true] i::after{left:23px}
  .sw.big i{width:56px;height:32px;border-radius:16px}.sw.big i::after{width:26px;height:26px}.sw.big[aria-pressed=true] i::after{left:27px}
  .sw:disabled{opacity:.5;cursor:wait}
  .eyebrow{margin:0 0 -6px 4px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b6861}
  /* set-up checklist: one card per step left; the whole block goes when every step is done */
  .setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
  .setup .step{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:180px;padding:40px 18px 22px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
  .setup .num{position:absolute;top:12px;left:12px;width:26px;height:26px;border-radius:50%;background:var(--usc);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .setup .t{font-size:16px;font-weight:700}.setup .d{font-size:13px;color:var(--mute);line-height:1.4}.setup .d b{font-weight:600;color:var(--ink)}
  .setup .step>.t{margin-top:auto}.setup .step>:last-child{margin-top:auto}.setup .step .btn{margin-bottom:0}
  .setup .step.done{border-color:var(--ok);background:#f1faf3}.setup .step.done .num{background:var(--ok)}.setup .ok{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 0;font-size:14px;font-weight:600;color:var(--ok)}.setup .ok .ck{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--ok);color:#fff;font-size:22px;font-weight:700}
  .lqtoast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9500;background:#1a1a1a;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .cls .nx{font-size:13px;color:var(--mute);margin-top:4px}.cls .rem{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px;margin-top:10px}
  .cls{display:flex;flex-direction:column;gap:20px}
  .cls.off{opacity:.72}
  .cls .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .cls .top a{display:flex;flex-direction:column;gap:2px;color:var(--ink);min-width:0}
  .cls .top a:hover{text-decoration:none}.cls .top a:hover span:first-child{text-decoration:underline}
  .cls .top .nm{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .cls .top .sm{font-size:14px;color:#6b6861}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  @media(max-width:700px){.tiles{grid-template-columns:1fr}}
  .tile{background:#faf9f6;border:1px solid #ebe8e1;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
  .tile .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b6861}
  .tile .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .tile .v small{font-size:16px;font-weight:500;color:#6b6861}
  .tile .v.md{font-size:18px;line-height:1.2;letter-spacing:-.01em}
  .tile .n{font-size:13px;color:#6b6861}
  .bar{display:block;height:6px;border-radius:3px;background:#ebe8e1;overflow:hidden}.bar span{display:block;height:6px;background:var(--ok);border-radius:3px}
  .note{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:12px 16px;border-radius:10px;font-size:14px}
  .note.warn{background:var(--warnbg);border:1px solid var(--warnline);color:#6a4a00}
  .note.ok{background:var(--okbg);border:1px solid #bfe3c9;color:#0f5a25}
  .note.red{background:#fff1f1;border:1px solid #f0c4c4;color:var(--usc)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:10px 14px;min-height:44px;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none!important}
  .btn.warn{border-color:#d9b26b;color:#6a4a00}
  .btn.prime{background:var(--usc);border-color:var(--usc);color:#fff}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn:disabled{opacity:.5;cursor:wait}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;min-height:44px;align-self:flex-start}
  .two{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .two>section{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px}
  .two h2{margin:0;font-size:17px;font-weight:700}
  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.hrow span{font-size:13px;color:#6b6861}
  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  ul.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #efece6}
  ul.list .grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
  ul.list .t{font-size:15px;font-weight:600}ul.list .d{font-size:13px;color:#6b6861}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--off)}
  .dot.ok{background:var(--ok)}.dot.warn{background:#d97706}.dot.red{background:var(--usc)}
  .st{font-size:13px;font-weight:500;color:#6b6861;white-space:nowrap}.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.red{color:var(--usc);font-weight:700}
  .more{font-size:13px;color:var(--faint);text-align:center;padding-top:8px}
  .foot{margin:0 4px;font-size:13px;color:var(--faint)}
  .counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  @media(max-width:700px){.counts{grid-template-columns:1fr}}
  .count{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
  .count .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b6861}
  .count .v{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .count.ok .v{color:var(--ok)}.count.red{border:2px solid var(--usc)}.count.red .k,.count.red .v{color:var(--usc)}
  li.flag{background:#fff1f1;margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:8px}
  .pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--okbg);display:inline-block}
  /* login */
  .gate{min-height:calc(100vh - 73px);display:flex;align-items:center;justify-content:center;padding:40px 24px}
  .gate .card{width:100%;max-width:460px;padding:44px 40px;display:flex;flex-direction:column;gap:18px;text-align:center}
  .gate h1{margin:0;font-size:22px;font-weight:700}
  .gate p{margin:0;color:var(--mute)}
  .gate input{width:100%;padding:12px 14px;border:1px solid #cfccc4;border-radius:10px;font-size:16px}
  .gate .btn.prime{width:100%;min-height:52px;font-size:16px;border-radius:12px}
  .err{color:var(--usc);font-size:14px}
  .muted{color:var(--mute);font-size:14px}
  ol.steps{margin:0;padding-left:22px;line-height:1.9;color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #efece6;padding:8px;text-align:left;vertical-align:top}
  code{background:#f3f1ec;padding:2px 7px;border-radius:5px;font-size:13px;user-select:all}
  details.past summary{cursor:pointer;font-size:14px;color:var(--mute);padding:10px 0}
  .paypanel .hrow span{font-size:15px;color:inherit}
  /* first-visit tour: spotlight + speech bubble with an arrow */
  .tour-hole{position:fixed;z-index:9000;border-radius:12px;box-shadow:0 0 0 9999px rgba(20,18,14,.62);pointer-events:none;transition:all .25s ease;outline:3px solid #fff}
  .tour-block{position:fixed;inset:0;z-index:8999}
  .tour-tip{position:fixed;z-index:9001;width:min(340px,calc(100vw - 32px));background:#fff;color:var(--ink);border-radius:14px;padding:18px 18px 14px;box-shadow:0 12px 40px rgba(0,0,0,.3);transition:top .25s ease,left .25s ease}
  .tour-tip h3{margin:0 0 6px;font-size:17px;color:var(--usc)}
  .tour-tip p{margin:0;font-size:14.5px;line-height:1.5;color:#333}
  .tour-tip .tn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
  .tour-tip .tn span{font-size:12px;color:var(--faint)}
  .tour-tip .tn div{display:flex;gap:8px}
  .tour-tip .btn{min-height:36px;padding:6px 12px}
  .tour-tip::before{content:"";position:absolute;width:18px;height:18px;background:#fff;transform:rotate(45deg);left:var(--ax,30px)}
  .tour-tip.below::before{top:-8px}.tour-tip.above::before{bottom:-8px}.tour-tip.center::before{display:none}
  .tour-arrow{position:fixed;z-index:9002;font-size:34px;line-height:1;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none;animation:tbob 1s ease-in-out infinite}
  @keyframes tbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .tour-arrow.up{animation-name:tbobu}@keyframes tbobu{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
</style></head>
<body>
<header>
  <a class="brand" href="#" onclick="nav('');return false"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#990000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V7a4 4 0 0 1 8 0v4"/><rect x="5" y="11" width="14" height="10" rx="2" fill="#990000"/><circle cx="12" cy="16" r="1.4" fill="#fff" stroke="none"/></svg>LOCKqz</a>
  <details class="menu hide" id="menu">
    <summary id="who">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6861" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </summary>
    <div>
      <button onclick="nav('welcome')">How LOCKqz works</button>
      <button onclick="nav('connect')">Brightspace connection</button>
      <button onclick="nav('activity')">Activity log</button>
      <button id="m-admin" class="hide" onclick="nav('admin')">Admin</button>
      <button onclick="changePw()">Change password</button>
      <button onclick="logout()">Log out</button>
    </div>
  </details>
</header>

<!-- ============ LOGIN ============ -->
<div id="login" class="gate">
  <div class="card">
    <div class="brand" style="justify-content:center;font-size:26px"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#990000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V7a4 4 0 0 1 8 0v4"/><rect x="5" y="11" width="14" height="10" rx="2" fill="#990000"/><circle cx="12" cy="16" r="1.4" fill="#fff" stroke="none"/></svg>LOCKqz</div>
    <div><h1 id="ltitle">No AI during your exams.</h1><p id="lsub">Sign in. Your classes, rosters and exams come from Brightspace by themselves.</p></div>
    <input id="name" placeholder="Your name" class="hide" autocomplete="name">
    <input id="email" type="email" placeholder="USC email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button id="lbtn" class="btn prime" onclick="go()">Sign in</button>
    <div id="gsign" class="hide" style="display:flex;justify-content:center;min-height:44px"></div>
    <div class="err" id="lerr"></div>
    <div class="muted hide" id="signuprow"><a href="#" id="lswitch" onclick="toggle();return false">New here? Create an account</a></div>
    <div class="muted" id="forgotrow"><a href="#" onclick="showForgot();return false">Forgot password?</a></div>
    <div id="forgot" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <input id="femail" type="email" placeholder="Your account email">
      <button class="btn" onclick="requestReset()">Request password reset</button>
      <div class="muted" id="fmsg"></div>
    </div>
    <p class="muted" style="font-size:13px"><a href="/privacy.html">Privacy</a></p>
  </div>
</div>

<!-- ============ APP ============ -->
<main id="app" class="hide"></main>

<script src="/lq.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// The red lock loader from /lq.js (plain text if it did not load).
const lqL = (m, e, o) => typeof lqLoading === "function" ? lqLoading(m, e, o) : m + "…";
const API = /\.pages\.dev$/.test(location.hostname) ? "https://lockqz.pages.dev/api" : "/api", INSTALL = "https://lockqz.pages.dev";   // one API (main site secrets)
// ---- Professor extension store links (Chrome Web Store, live 29 Oct 2026; Edge installs from it too). A browser
// with no link (Firefox) gets the packaged .zip with a one-line load-unpacked fallback. ----
const EXT_STORE = { CHROME: "https://chromewebstore.google.com/detail/bidlfpkdggdpmfbfkpjcnbjhfkfligkk", EDGE: "https://chromewebstore.google.com/detail/bidlfpkdggdpmfbfkpjcnbjhfkfligkk", FIREFOX: "" };   // Chrome Web Store listing (Edge installs from it too); Firefox still uses the zip
const EXT_ZIP = { chrome: INSTALL + "/download/lockqz-prof-chromium.zip", edge: INSTALL + "/download/lockqz-prof-chromium.zip", firefox: INSTALL + "/download/lockqz-prof-firefox.zip", other: INSTALL + "/download/lockqz-prof-chromium.zip" };
const BS_SITE = "https://brightspace.usc.edu";
let token = localStorage.getItem("lockqz_token") || "";
let signup = false, ME = null, BS = { courses: [] }, LEGACY = [], SYNCKEY = "", liveTimer = null, INVITE = "", LOADERR = "", AUTO = null;
const $ = id => document.getElementById(id);
const H = () => ({ "X-LOCKqz-Teacher": token, "Content-Type":"application/json" });
// Every API call returns an object; a failure always carries {error}. A dead session (401) goes back to sign-in.
async function call(p, opt){
  let r; try { r = await fetch(API+p, opt); } catch(e){ return { error:"No connection to LOCKqz. Try again." }; }
  let d = null; try { d = await r.json(); } catch(e){}
  if(!d || typeof d!=="object") d = {};
  if(!r.ok && !d.error) d.error = "LOCKqz answered "+r.status;
  if(r.status===401 && token){ token=""; localStorage.removeItem("lockqz_token"); location.reload(); }
  d._status = r.status; return d;
}
const get  = p => call(p,{headers:H()});
const post = (p,b) => call(p,{method:"POST",headers:H(),body:JSON.stringify(b||{})});
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = t => t ? new Date(t).toLocaleString([], {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
const ago = t => { if(!t) return "never"; const m=Math.round((Date.now()-Date.parse(t))/60000); return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"; };
const cname = c => String(c.name||c.ou).replace(/^\d+_\w+\s*/,"");
const SHIELD = (c,s) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V7a4 4 0 0 1 8 0v4"/><rect x="5" y="11" width="14" height="10" rx="2" fill="${c}"/><circle cx="12" cy="16" r="1.4" fill="#fff" stroke="none"/></svg>`;
const BACK = (to,label) => `<a class="back" href="#${esc(to)}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>${label}</a>`;

// ---- login (unchanged behaviour) ----
function toggle(){ signup=!signup; $("name").classList.toggle("hide",!signup); $("ltitle").textContent=signup?"Create your professor account":"No AI during your exams.";
  $("lbtn").textContent=signup?"Create account":"Sign in"; $("lswitch").textContent=signup?"Already have an account? Sign in":"New here? Create an account"; $("lerr").textContent="";
  $("forgotrow").classList.toggle("hide", signup); $("forgot").classList.add("hide"); }
async function go(){
  $("lerr").innerHTML = lqL(signup ? "Creating your account" : "Signing you in", "This takes about 2 seconds", {small:true});
  const d = await post(signup?"/signup":"/login",{email:$("email").value,password:$("pw").value,name:$("name").value,invite:INVITE});
  $("lerr").textContent = "";
  if(d.error){ $("lerr").textContent = !signup && d._status===401 ? "Incorrect password — try again." : d.error; return; }
  token=d.token; localStorage.setItem("lockqz_token",token);
  if(INVITE){ INVITE=""; history.replaceState(null,"",location.pathname); }
  boot();
}
function showForgot(){ $("forgot").classList.remove("hide"); $("femail").value=$("email").value||""; $("fmsg").textContent=""; }
async function requestReset(){ const email=$("femail").value.trim(); if(!email){ $("fmsg").textContent="Enter your email."; return; }
  const d = await post("/forgot",{email}); $("fmsg").textContent = d.error || "If that account exists, your LOCKqz admin has been notified and will give you a new password."; }
async function changePw(){ const old = prompt("Current password:"); if(old===null) return;
  const pw = prompt("Enter a new password (at least 8 characters):"); if(pw===null) return;
  if(pw.length<8){ alert("Password must be at least 8 characters."); return; }
  const d = await post("/changepw",{old_password:old,password:pw}); if(d.error){ alert(d.error); return; }
  token=d.token; localStorage.setItem("lockqz_token",token); SYNCKEY="";   // the server issued a new Sync key: refresh() hands it to the extension
  await refresh(); route();
  alert("Password changed."); }
["email","pw","name"].forEach(i=>$(i).addEventListener("keydown",e=>{ if(e.key==="Enter") go(); }));
async function logout(){ await post("/logout"); token=""; localStorage.removeItem("lockqz_token"); location.hash=""; location.reload(); }

// ---- boot ----
async function boot(){
  if(!token) return;
  $("login").classList.add("hide"); $("app").classList.remove("hide"); $("app").innerHTML = lqL("Opening LOCKqz", "This takes about 2 seconds");
  const m = await get("/me");
  if(m.error){ $("app").classList.add("hide"); $("login").classList.remove("hide"); $("lerr").textContent = m._status===401 ? "" : m.error; if(m._status===401){ token=""; localStorage.removeItem("lockqz_token"); } return; }
  ME = m;
  $("login").classList.add("hide"); $("app").classList.remove("hide"); $("menu").classList.remove("hide");
  $("who").insertAdjacentHTML("afterbegin", esc(m.name||m.email));
  if(m.admin) $("m-admin").classList.remove("hide");
  await refresh(); route();
  if(m.trial && typeof lqWelcome === "function") lqWelcome(m.email);
  if(!AUTO) AUTO = setInterval(autoRefresh, 900000);
}
async function refresh(){

  const tail = `subject=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(d.text)}`;
  const full = `mailto:?bcc=${encodeURIComponent(d.to.join(","))}&${tail}`;
  if (full.length <= 1900) { location.href = full; toast(`Your email is open with ${d.to.length} student${d.to.length===1?"":"s"} in Bcc. Press Send.`); }
  else {
    let copied = false; try { await navigator.clipboard.writeText(d.to.join(", ")); copied = true; } catch {}
    location.href = `mailto:?${tail}`;
    if (copied) toast(`${d.to.length} addresses copied. Paste them into Bcc, then press Send.`);
    else showAddresses(d.to);

}

async function loadLive(id){

  const nameOf = r => { const k=(r.email||r.student||"").toLowerCase(); const s=c&&c.students.find(x=>(x.email||"").toLowerCase()===k||(x.name||"").toLowerCase()===k); return s?s.name:(r.student||r.device_id); };
  const notStarted = c ? c.students.filter(s=>!seen.has((s.email||"").toLowerCase()) && !seen.has((s.name||"").toLowerCase())) : [];
  const letin = new Set((d.letin_emails||[]).map(e=>String(e).toLowerCase()));
  const letBtn = (s, on) => s && s.email ? `<button class="btn${on?'':' ok'}" style="padding:4px 12px;font-size:13px;min-height:32px" onclick="letIn('${esc(id)}','${esc(s.email)}',${on})">${on?"Let in":"Undo"}</button>` : "";

  const lbl = r => r.status==="done" && r.submitted ? ["","Submitted · unlocked"]
    : r.status==="locked" && r.unpaid ? ["warn","Locked · not admitted (unpaid)"]
    : r.status==="locked" && (r.unverified || r.verified===false) ? ["warn","Locked · not admitted (unverified)"]

    const l = r.status==="left_early" && r.reason ? `${l0} · ${WHY[r.reason]||r.reason}${r.flagged_at?" "+new Date(r.flagged_at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):""}` : l0;
    return `<li class="${k==='red'?'flag':''}"><span class="dot ${k}"></span><span class="grow"><span style="font-size:15px;font-weight:${k==='red'?700:500}">${esc(nameOf(r))}${devCell(r.device_id)}</span></span><span class="st ${k}">${esc(l)}</span><span class="st" style="min-width:48px;text-align:right">${t}</span></li>`; })
    .concat(notStarted.map(s=>{ const inn = letin.has((s.email||"").toLowerCase());
      return `<li><span class="dot ${inn?'ok':''}"></span><span class="grow"><span style="font-size:15px">${esc(s.name)}</span></span><span class="st">${inn?"Let in · no LOCKqz":"No LOCKqz lock seen"}</span><span class="st" style="min-width:64px;text-align:right">${letBtn(s, !inn)}</span></li>`; }));

}

// ---- per-section payment ($1,000 per section per semester, Venmo) ----
let PAY=null, PAYSEL=null, PAYAT=0;
const termName = t => { t=String(t||""); return (({1:"Spring",2:"Summer",3:"Fall"})[t.slice(4)]||"")+" "+t.slice(0,4); };
const money = n => "$"+Number(n).toLocaleString("en-US");
async function loadPay(name){ const el=$("pay"); if(!el) return;
  const d = await get("/my-sections"+(name?("?name="+encodeURIComponent(name)):"")); if(d.error){ if(name) alert(d.error); return; }
  PAY=d; PAYAT=Date.now(); PAYSEL=new Set(d.sections.filter(s=>!s.paid).map(s=>s.section)); renderPay(); }
let PAYWAIT=null;
// Unpaid: check every 15 s while the tab is visible (stops when hidden); opens LOCKqz the moment the payment lands.
function waitPaid(){ if(PAYWAIT) return; PAYWAIT = setInterval(async()=>{ if(document.visibilityState==="hidden") return; const m = await get("/me"); if(m && m.active){ clearInterval(PAYWAIT); PAYWAIT=null; ME=m; await refresh(); route(); } }, 15000); }
function paySel(s,on){ on?PAYSEL.add(s):PAYSEL.delete(s); renderPay(); }
function renderPay(){ const d=PAY, el=$("pay"); if(!el||!d) return;
  if(d.all_active || (d.sections.length && d.sections.every(s=>s.paid))){ el.innerHTML=""; return; }   // nothing left to pay
  const usc = /@usc\.edu$/i.test((ME&&ME.email)||"");   // the Schedule of Classes lookup is USC's
  const nameBox = !usc ? "" : `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label for="pname" class="muted">Name in the USC Schedule of Classes</label><input id="pname" value="${esc(d.name||"")}" placeholder="First Last" style="padding:10px;border:1px solid #cfccc4;border-radius:8px;flex:1 1 200px"><button class="btn" onclick="loadPay($('pname').value)">Find my sections</button></div>`;
  const note=d.memo, got=Number(d.received)||0, base=d.amount??d.price;
  const fx = n => ({ total:n, base:n, tax:0 });
  PW = d.ways || { zelle:fx(base), bank:fx(base), venmo:fx(base), po:fx(base), card:fx(d.stripe?d.stripe.card:base) }; PT = d.tax || null;
  const ways = [d.zelle&&["zelle","Zelle","Lowest price · arrives in minutes"], d.venmo&&["venmo","Venmo","Memo filled in"], d.stripe&&["card","Card","Instant"], d.invoice&&["bank","Bank transfer (ACH / wire)","Bank details emailed to you"], d.po&&["po","Purchase order (PO)","Your department pays"]].filter(Boolean);

let PW=null, PT=null;
// The "Processing your payment" lock shows only once the professor starts paying (memo copied, Venmo/card/bank opened).
function payStarted(){ const w=$("pwait"); if(w && !w.innerHTML) w.innerHTML = lqL("Processing your payment", "This should take no longer than a minute"); }
// One line: "LOCKqz  $6,500" (the total; no tax / fees lines - owner 29 Oct).
function payTax(w){ return `<div class="hrow" style="font-weight:800;font-size:17px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #eee"><span>LOCKqz</span><span>${money(w.total)}</span></div>`; }
// Picking a way opens its steps; the price up top jumps to that way's total, the tax shown as its own line.
function payPick(k){ const d=PAY, w=PW[k], box=$("pp_"+k), open=box.classList.contains("hide");
  document.querySelectorAll(".paypanel").forEach(x=>x.classList.add("hide")); document.querySelectorAll(".payway").forEach(x=>x.setAttribute("aria-expanded","false"));
  $("pprice").textContent = money(open ? w.total : PW.zelle.total); $("pincl").textContent = "";
  if(!open) return;
  box.classList.remove("hide"); document.querySelector(`.payway[data-k="${k}"]`).setAttribute("aria-expanded","true");
  const memo = esc(d.memo), amt = w.total.toFixed(2);
  box.innerHTML = payTax(w) + ({
    zelle: `<ol class="steps" style="line-height:1.7"><li><button class="btn prime" onclick="navigator.clipboard.writeText(PAY.memo);this.textContent='Memo copied ✓';payStarted()">Copy memo ${memo}</button></li><li>Bank app → <b>Zelle</b> → Send to <b>${esc(d.zelle)}</b></li><li>Amount <b>${money(w.total)}</b></li><li><b>Paste the memo</b> into the <b>Memo</b> box on the Zelle payment, send. LOCKqz turns on within a minute.</li></ol>`,
    bank: `<button class="btn prime" style="width:100%" onclick="payStarted();profBank(this)">Email me the bank details</button><p class="muted" id="pbmsg" style="margin:8px 0 0">Account, amount and memo, sent to ${esc(ME.email)} right away. LOCKqz turns on by itself when the money arrives.</p>`,
    venmo: `<a class="btn prime" style="width:100%" href="https://venmo.com/?txn=pay&recipients=${encodeURIComponent(d.venmo||"")}&amount=${amt}&note=${encodeURIComponent(d.memo)}" target="_blank" rel="noopener" onclick="payStarted()">Open Venmo · ${money(w.total)}</a><p class="muted" style="margin:8px 0 0">Your memo is already in the Venmo <b>note</b>. Leave it there.</p>`,
    card: `<button class="btn prime" style="width:100%" onclick="payStarted();stripePay('card',this)">Pay ${money(w.total)} by card</button>${d.stripe&&d.stripe.bank ? `<button class="btn" style="width:100%;margin-top:8px" onclick="stripePay('bank',this)">Bank account ${money(d.stripe.bank)}</button>` : ""}`,
    po: `<a class="btn prime" style="width:100%" href="mailto:${esc(d.po)}?subject=${encodeURIComponent("LOCKqz purchase order "+d.memo)}&body=${encodeURIComponent("PO number:\nBilling contact:\nAmount: "+money(w.total)+"\nTerm: "+termName(d.term)+"\nMemo: "+d.memo)}">Email the PO to ${esc(d.po)}</a>`
  })[k]; }
async function profBank(b){ b.disabled=true; b.textContent="Sending…"; const r = await post("/pay/bank",{email:ME.email}); b.disabled=false;
  b.textContent = r.sent ? "Sent ✓" : "Email me the bank details"; $("pbmsg").textContent = r.error || (r.paid ? "Already paid." : "Sent to "+ME.email+". Send the amount with memo "+PAY.memo+"."); }
async function stripePay(method,btn){ btn.disabled=true; const t=btn.textContent; btn.textContent="…";
  const d = await post("/pay/stripe-prof",{method, back: location.origin + location.pathname});
  if(d && d.url){ location.href=d.url; return; } btn.disabled=false; btn.textContent=t; alert((d&&d.error)||"Try again."); }
async function secAdmin(email){ const el=$("secpanel"); el.innerHTML=lqL("Loading sections", "This takes about 2 seconds", {small:true});
  const d = await get("/teacher-sections?email="+encodeURIComponent(email)); if(d.error){ el.innerHTML=esc(d.error); return; }

    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="muted">paid until</span><input type="date" id="secuntil" value="${semEnd()}" style="padding:6px"><button class="btn prime" data-email="${esc(d.email)}" data-term="${esc(d.term)}" onclick="markSecs(this.dataset.email,this.dataset.term,false)">Mark ticked paid</button><button class="btn" data-email="${esc(d.email)}" data-term="${esc(d.term)}" onclick="markSecs(this.dataset.email,this.dataset.term,true)">Mark ticked unpaid</button></div></div>`; }

  const d=await post("/pay-sections",{email,term,sections,until:$("secuntil").value,off}); if(d.error) alert(d.error); secAdmin(email); loadTeachers(); }
async function loadPayments(){ const d = await get("/payments"); const tb=document.querySelector("#payments tbody"); if(!tb) return;
  if(d.error){ tb.innerHTML=`<tr><td colspan="7" class="err">${esc(d.error)}</td></tr>`; return; }

const inviteLink = code => location.origin + "/?invite=" + code;

// ---- first-visit tour: a spotlight on each part of the page with a speech bubble and an arrow pointing at it.

const TOURKEY = () => "lockqz_tour_" + String((ME && ME.email) || "").toLowerCase();

    S('section[aria-label="Status"] h1', "Your status, at a glance", "This line tells you whether LOCKqz is protecting your upcoming exams. Green shield = on."),

    S('section[aria-label="Status"] .syncst', "Sync with Brightspace", "LOCKqz reads your classes, rosters and exams from Brightspace by itself. Press Sync now after you add a quiz or a student."),
    S(".cls .top a", "Your classes", "Every Brightspace class you teach. Click a class to see each exam and each student."),
    S(".cls .top .sw", "One class on or off", "Turns LOCKqz on or off for this class only."),
    S(".cls .tile:nth-child(1)", "Students ready", "How many students on the roster have installed LOCKqz. A student without it cannot open a protected exam."),
    S(".cls .tile:nth-child(2)", "Exams protected", "How many of this class's upcoming exams LOCKqz is protecting."),
    S(".cls .tile:nth-child(3)", "Next exam", "The next exam and when it opens."),

    S("#menu summary", "Your menu", "How LOCKqz works, the Brightspace connection, the activity log and your password."),
    S(null, "That's it", "LOCKqz runs by itself from here. Students install it once from lockqz.pages.dev. You never type an exam password."),

const visibleEl = sel => { const e = document.querySelector(sel); if (!e) return null; const r = e.getBoundingClientRect(); return r.width > 0 && r.height > 0 ? e : null; };
let TOUR = null;
function startTour(force){
  $("menu").removeAttribute("open");
  if (!force) { try { if (localStorage.getItem(TOURKEY())) return; } catch (e) {} }
  if (viewName() !== "") { nav(""); setTimeout(() => startTour(true), 400); return; }
  if (document.querySelector(".lqwel")) { setTimeout(() => startTour(force), 700); return; }   // trial welcome first
  endTour(false);
  const steps = tourSteps(); if (!steps.length) return;
  const block = document.createElement("div"); block.className = "tour-block";
  const hole = document.createElement("div"); hole.className = "tour-hole";
  const tip = document.createElement("div"); tip.className = "tour-tip"; tip.setAttribute("role", "dialog"); tip.setAttribute("aria-live", "polite");
  const arrow = document.createElement("div"); arrow.className = "tour-arrow"; arrow.setAttribute("aria-hidden", "true");
  document.body.append(block, hole, tip, arrow);
  TOUR = { steps, i: 0, block, hole, tip, arrow };
  const key = e => { if (!TOUR) return; if (e.key === "Escape") endTour(true); else if (e.key === "ArrowRight" || e.key === "Enter") tourGo(1); else if (e.key === "ArrowLeft") tourGo(-1); };
  TOUR.key = key; document.addEventListener("keydown", key);
  TOUR.re = () => tourShow(); window.addEventListener("resize", TOUR.re); window.addEventListener("scroll", TOUR.re, true);
  tourShow();
}
function tourGo(d){ if (!TOUR) return; const n = TOUR.i + d; if (n >= TOUR.steps.length) return endTour(true); if (n < 0) return; TOUR.i = n; tourShow(true); }
function endTour(done){ if (!TOUR) return; ["block","hole","tip","arrow"].forEach(k => TOUR[k].remove());
  document.removeEventListener("keydown", TOUR.key); window.removeEventListener("resize", TOUR.re); window.removeEventListener("scroll", TOUR.re, true);
  TOUR = null; if (done) try { localStorage.setItem(TOURKEY(), "1"); } catch (e) {} }
function tourShow(scroll){
  const T = TOUR; if (!T) return; const st = T.steps[T.i], last = T.i === T.steps.length - 1;
  const el = st.sel && document.querySelector(st.sel);
  T.tip.innerHTML = `<h3>${esc(st.title)}</h3><p>${esc(st.text)}</p><div class="tn"><span>${T.i + 1} of ${T.steps.length}</span><div>${last ? "" : `<button class="btn" onclick="endTour(true)">Skip</button>`}${T.i ? `<button class="btn" onclick="tourGo(-1)">Back</button>` : ""}<button class="btn prime" onclick="tourGo(1)">${last ? "Done" : "Next"}</button></div></div>`;
  const vw = innerWidth, vh = innerHeight, tw = T.tip.offsetWidth, th = T.tip.offsetHeight;
  if (!el) {   // no target: a bubble in the middle, no arrow
    Object.assign(T.hole.style, { top: vh/2 + "px", left: vw/2 + "px", width: "0px", height: "0px" });
    T.tip.className = "tour-tip center"; T.tip.style.top = Math.max(16, (vh - th) / 2) + "px"; T.tip.style.left = Math.max(16, (vw - tw) / 2) + "px";
    T.arrow.style.display = "none"; T.tip.querySelector(".btn.prime").focus(); return;
  }
  if (scroll) { const r0 = el.getBoundingClientRect(); if (r0.top < 80 || r0.bottom > vh - th - 60) el.scrollIntoView({ block: "center", behavior: "instant" }); }
  const r = el.getBoundingClientRect(), pad = 8;
  Object.assign(T.hole.style, { top: (r.top - pad) + "px", left: (r.left - pad) + "px", width: (r.width + pad*2) + "px", height: (r.height + pad*2) + "px" });
  const below = r.bottom + pad + 54 + th < vh || r.top - pad - 54 - th < 0;
  const top = below ? r.bottom + pad + 50 : r.top - pad - 50 - th;
  const cx = r.left + r.width / 2, left = Math.min(vw - tw - 16, Math.max(16, cx - tw / 2));
  T.tip.className = "tour-tip " + (below ? "below" : "above"); T.tip.style.top = top + "px"; T.tip.style.left = left + "px";
  T.tip.style.setProperty("--ax", Math.min(tw - 30, Math.max(12, cx - left - 9)) + "px");
  T.arrow.style.display = ""; T.arrow.className = "tour-arrow" + (below ? " up" : "");
  T.arrow.textContent = below ? "⬆" : "⬇";
  T.arrow.style.left = (cx - 15) + "px"; T.arrow.style.top = (below ? r.bottom + pad + 6 : r.top - pad - 44) + "px";
  T.tip.querySelector(".btn.prime").focus({ preventScroll: true });
}
// After the home page (or the first-visit Connect page) draws: the tour, once.
function maybeTour(){ if (!ME || TOUR) return; let seen = false; try { seen = !!localStorage.getItem(TOURKEY()); } catch (e) { seen = true; }
  return; }   // 27 Oct 2026: the welcome page replaced the automatic tour

// Sign in with Google (only when Google sign-in is on): the same account, no password typed.
async function gSignIn(resp){
  $("lerr").innerHTML = lqL("Signing you in", "This takes about 2 seconds", {small:true});
  const d = await post("/auth/google", { credential: resp.credential });
  $("lerr").textContent = "";
  if(d.error || !d.token){ $("lerr").textContent = d.error || "Google sign-in failed. Try again."; return; }
  token=d.token; localStorage.setItem("lockqz_token",token); boot();
}
async function gInit(){
  if(token) return;
  const v = await call("/version", {}); if(!v || !v.google) return;
  const draw = () => { if(!window.google || !google.accounts || !google.accounts.id) return false;
    google.accounts.id.initialize({ client_id: v.google, callback: gSignIn, auto_select: false, ux_mode: "popup", itp_support: true });
    google.accounts.id.renderButton($("gsign"), { theme: "outline", size: "large", text: "signin_with", shape: "pill", width: 280 });
    $("gsign").classList.remove("hide"); return true; };
  if(!draw()) window.addEventListener("load", draw);
}
boot();
gInit();
</script>
