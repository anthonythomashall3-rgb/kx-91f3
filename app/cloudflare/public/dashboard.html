<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOCKqz</title>
<style>
  :root{--usc:#990000;--ink:#1a1a1a;--mute:#5c5952;--faint:#8a877f;--line:#e6e3dc;--bg:#f6f5f2;--ok:#1a7f37;--okbg:#e3f3e8;--warn:#b45309;--warnbg:#fff6e8;--warnline:#f3dcb3;--off:#c9c5bb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,Segoe UI,system-ui,sans-serif}
  a{color:var(--usc);text-decoration:none}a:hover{text-decoration:underline}
  button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0}
  input{font:inherit}
  .hide{display:none!important}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 32px;background:#fff;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .brand:hover{text-decoration:none}
  .menu{position:relative}
  .menu>summary{list-style:none;display:flex;align-items:center;gap:8px;font-weight:500;padding:10px 4px;min-height:44px;cursor:pointer}
  .menu>summary::-webkit-details-marker{display:none}
  .menu>div{position:absolute;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);min-width:230px;padding:6px;z-index:10;display:flex;flex-direction:column}
  .menu>div button,.menu>div a{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;color:var(--ink);font-size:14px}
  .menu>div button:hover,.menu>div a:hover{background:var(--bg);text-decoration:none}
  main{width:100%;max-width:1040px;margin:0 auto;padding:32px 24px 56px;display:flex;flex-direction:column;gap:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 28px}
  .band{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px}
  .band h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
  .sub{margin:4px 0 0;color:var(--mute);font-size:15px}
  .orb{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--okbg)}
  .orb.off{background:#f1efe9}
  .sw{display:flex;align-items:center;gap:10px;padding:6px;min-height:44px}
  .sw b{font-size:14px;font-weight:600}
  .sw i{position:relative;width:48px;height:28px;border-radius:14px;background:var(--off);display:inline-block;transition:background .2s;flex-shrink:0}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
  .sw[aria-pressed=true] i{background:var(--ok)}.sw[aria-pressed=true] i::after{left:23px}
  .sw.big i{width:56px;height:32px;border-radius:16px}.sw.big i::after{width:26px;height:26px}.sw.big[aria-pressed=true] i::after{left:27px}
  .sw:disabled{opacity:.5;cursor:wait}
  .eyebrow{margin:0 0 -6px 4px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b6861}
  .cls{display:flex;flex-direction:column;gap:20px}
  .cls.off{opacity:.72}
  .cls .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .cls .top a{display:flex;flex-direction:column;gap:2px;color:var(--ink);min-width:0}
  .cls .top a:hover{text-decoration:none}.cls .top a:hover span:first-child{text-decoration:underline}
  .cls .top .nm{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .cls .top .sm{font-size:14px;color:#6b6861}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  @media(max-width:700px){.tiles{grid-template-columns:1fr}}
  .tile{background:#faf9f6;border:1px solid #ebe8e1;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
  .tile .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b6861}
  .tile .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .tile .v small{font-size:16px;font-weight:500;color:#6b6861}
  .tile .v.md{font-size:18px;line-height:1.2;letter-spacing:-.01em}
  .tile .n{font-size:13px;color:#6b6861}
  .bar{display:block;height:6px;border-radius:3px;background:#ebe8e1;overflow:hidden}.bar span{display:block;height:6px;background:var(--ok);border-radius:3px}
  .note{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:12px 16px;border-radius:10px;font-size:14px}
  .note.warn{background:var(--warnbg);border:1px solid var(--warnline);color:#6a4a00}
  .note.ok{background:var(--okbg);border:1px solid #bfe3c9;color:#0f5a25}
  .note.red{background:#fff1f1;border:1px solid #f0c4c4;color:var(--usc)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:10px 14px;min-height:44px;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none!important}
  .btn.warn{border-color:#d9b26b;color:#6a4a00}
  .btn.prime{background:var(--usc);border-color:var(--usc);color:#fff}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn:disabled{opacity:.5;cursor:wait}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;min-height:44px;align-self:flex-start}
  .two{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .two>section{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px}
  .two h2{margin:0;font-size:17px;font-weight:700}
  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.hrow span{font-size:13px;color:#6b6861}
  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  ul.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #efece6}
  ul.list .grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
  ul.list .t{font-size:15px;font-weight:600}ul.list .d{font-size:13px;color:#6b6861}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--off)}
  .dot.ok{background:var(--ok)}.dot.warn{background:#d97706}.dot.red{background:var(--usc)}
  .st{font-size:13px;font-weight:500;color:#6b6861;white-space:nowrap}.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.red{color:var(--usc);font-weight:700}
  .more{font-size:13px;color:var(--faint);text-align:center;padding-top:8px}
  .foot{margin:0 4px;font-size:13px;color:var(--faint)}
  .counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  @media(max-width:700px){.counts{grid-template-columns:1fr}}
  .count{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
  .count .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b6861}
  .count .v{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .count.ok .v{color:var(--ok)}.count.red{border:2px solid var(--usc)}.count.red .k,.count.red .v{color:var(--usc)}
  li.flag{background:#fff1f1;margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:8px}
  .pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--okbg);display:inline-block}
  /* login */
  .gate{min-height:calc(100vh - 73px);display:flex;align-items:center;justify-content:center;padding:40px 24px}
  .gate .card{width:100%;max-width:460px;padding:44px 40px;display:flex;flex-direction:column;gap:18px;text-align:center}
  .gate h1{margin:0;font-size:22px;font-weight:700}
  .gate p{margin:0;color:var(--mute)}
  .gate input{width:100%;padding:12px 14px;border:1px solid #cfccc4;border-radius:10px;font-size:16px}
  .gate .btn.prime{width:100%;min-height:52px;font-size:16px;border-radius:12px}
  .err{color:var(--usc);font-size:14px}
  .muted{color:var(--mute);font-size:14px}
  .bmk{display:inline-flex;align-items:center;gap:8px;background:var(--usc);color:#fff!important;font-weight:700;padding:12px 18px;border-radius:10px;cursor:grab;text-decoration:none!important}
  ol.steps{margin:0;padding-left:22px;line-height:1.9;color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #efece6;padding:8px;text-align:left;vertical-align:top}
  code{background:#f3f1ec;padding:2px 7px;border-radius:5px;font-size:13px;user-select:all}
  details.past summary{cursor:pointer;font-size:14px;color:var(--mute);padding:10px 0}
</style></head>
<body>
<header>
  <a class="brand" href="#" onclick="nav('');return false"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#990000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>LOCKqz</a>
  <details class="menu hide" id="menu">
    <summary id="who">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6861" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </summary>
    <div>
      <button onclick="nav('connect')">Brightspace connection</button>
      <button onclick="nav('activity')">Activity log</button>
      <button id="m-admin" class="hide" onclick="nav('admin')">Admin</button>
      <button onclick="changePw()">Change password</button>
      <button onclick="logout()">Log out</button>
    </div>
  </details>
</header>

<!-- ============ LOGIN ============ -->
<div id="login" class="gate">
  <div class="card">
    <div class="brand" style="justify-content:center;font-size:26px"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#990000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>LOCKqz</div>
    <div><h1 id="ltitle">No AI during your exams.</h1><p id="lsub">Sign in. Your classes, rosters and exams come from Brightspace by themselves.</p></div>
    <input id="name" placeholder="Your name" class="hide" autocomplete="name">
    <input id="email" type="email" placeholder="USC email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button id="lbtn" class="btn prime" onclick="go()">Sign in</button>
    <div class="err" id="lerr"></div>
    <div class="muted hide" id="signuprow"><a href="#" id="lswitch" onclick="toggle();return false">New here? Create an account</a></div>
    <div class="muted" id="forgotrow"><a href="#" onclick="showForgot();return false">Forgot password?</a></div>
    <div id="forgot" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <input id="femail" type="email" placeholder="Your account email">
      <button class="btn" onclick="requestReset()">Request password reset</button>
      <div class="muted" id="fmsg"></div>
    </div>
    <p class="muted" style="font-size:13px"><a href="/privacy.html">Privacy</a></p>
  </div>
</div>

<!-- ============ APP ============ -->
<main id="app" class="hide"></main>

<script src="/lq.js"></script>
<script>
// The red lock loader from /lq.js (plain text if it did not load).
const lqL = (m, e, o) => typeof lqLoading === "function" ? lqLoading(m, e, o) : m + "…";
const API = /\.pages\.dev$/.test(location.hostname) ? "https://lockqz.pages.dev/api" : "/api", INSTALL = "https://lockqz.pages.dev";   // one API (main site secrets)
let token = localStorage.getItem("lockqz_token") || "";
let signup = false, ME = null, BS = { courses: [] }, LEGACY = [], SYNCKEY = "", liveTimer = null, INVITE = "", LOADERR = "", AUTO = null;
const $ = id => document.getElementById(id);
const H = () => ({ "X-LOCKqz-Teacher": token, "Content-Type":"application/json" });
// Every API call returns an object; a failure always carries {error}. A dead session (401) goes back to sign-in.
async function call(p, opt){
  let r; try { r = await fetch(API+p, opt); } catch(e){ return { error:"No connection to LOCKqz. Try again." }; }
  let d = null; try { d = await r.json(); } catch(e){}
  if(!d || typeof d!=="object") d = {};
  if(!r.ok && !d.error) d.error = "LOCKqz answered "+r.status;
  if(r.status===401 && token){ token=""; localStorage.removeItem("lockqz_token"); location.reload(); }
  d._status = r.status; return d;
}
const get  = p => call(p,{headers:H()});
const post = (p,b) => call(p,{method:"POST",headers:H(),body:JSON.stringify(b||{})});
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = t => t ? new Date(t).toLocaleString([], {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
const ago = t => { if(!t) return "never"; const m=Math.round((Date.now()-Date.parse(t))/60000); return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"; };
const cname = c => String(c.name||c.ou).replace(/^\d+_\w+\s*/,"");
const SHIELD = (c,s) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>`;
const BACK = (to,label) => `<a class="back" href="#${esc(to)}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>${label}</a>`;

// ---- login (unchanged behaviour) ----
function toggle(){ signup=!signup; $("name").classList.toggle("hide",!signup); $("ltitle").textContent=signup?"Create your professor account":"No AI during your exams.";
  $("lbtn").textContent=signup?"Create account":"Sign in"; $("lswitch").textContent=signup?"Already have an account? Sign in":"New here? Create an account"; $("lerr").textContent="";
  $("forgotrow").classList.toggle("hide", signup); $("forgot").classList.add("hide"); }
async function go(){
  $("lerr").innerHTML = lqL(signup ? "Creating your account" : "Signing you in", "This takes about 2 seconds", {small:true});
  const d = await post(signup?"/signup":"/login",{email:$("email").value,password:$("pw").value,name:$("name").value,invite:INVITE});
  $("lerr").textContent = "";
  if(d.error){ $("lerr").textContent = !signup && d._status===401 ? "Incorrect email or password." : d.error; return; }
  token=d.token; localStorage.setItem("lockqz_token",token);
  if(INVITE){ INVITE=""; history.replaceState(null,"",location.pathname); }
  boot();
}
function showForgot(){ $("forgot").classList.remove("hide"); $("femail").value=$("email").value||""; $("fmsg").textContent=""; }
async function requestReset(){ const email=$("femail").value.trim(); if(!email){ $("fmsg").textContent="Enter your email."; return; }
  const d = await post("/forgot",{email}); $("fmsg").textContent = d.error || "If that account exists, your LOCKqz admin has been notified and will give you a new password."; }
async function changePw(){ const old = prompt("Current password:"); if(old===null) return;
  const pw = prompt("Enter a new password (at least 8 characters):"); if(pw===null) return;
  if(pw.length<8){ alert("Password must be at least 8 characters."); return; }
  const d = await post("/changepw",{old_password:old,password:pw}); if(d.error){ alert(d.error); return; }
  token=d.token; localStorage.setItem("lockqz_token",token); SYNCKEY="";   // the server ended the old session and Sync bookmark
  await refresh(); location.hash="connect"; route();
  alert("Password changed. Your old LOCKqz Sync bookmark stopped working: drag the new one to your bookmarks bar."); }
["email","pw","name"].forEach(i=>$(i).addEventListener("keydown",e=>{ if(e.key==="Enter") go(); }));
async function logout(){ await post("/logout"); token=""; localStorage.removeItem("lockqz_token"); location.hash=""; location.reload(); }

// ---- boot ----
async function boot(){
  if(!token) return;
  $("login").classList.add("hide"); $("app").classList.remove("hide"); $("app").innerHTML = lqL("Opening LOCKqz", "This takes about 2 seconds");
  const m = await get("/me");
  if(m.error){ $("app").classList.add("hide"); $("login").classList.remove("hide"); $("lerr").textContent = m._status===401 ? "" : m.error; if(m._status===401){ token=""; localStorage.removeItem("lockqz_token"); } return; }
  ME = m;
  $("login").classList.add("hide"); $("app").classList.remove("hide"); $("menu").classList.remove("hide");
  $("who").insertAdjacentHTML("afterbegin", esc(m.name||m.email));
  if(m.admin) $("m-admin").classList.remove("hide");
  await refresh(); route();
  if(m.trial && typeof lqWelcome === "function") lqWelcome(m.email);
  if(!AUTO) AUTO = setInterval(autoRefresh, 300000);
}
async function refresh(){
  const [m,b,q,k] = await Promise.all([get("/me"), get("/bs"), get("/quizzes"), SYNCKEY?{key:SYNCKEY}:get("/synckey")]);
  if(!m.error) ME = m;
  LOADERR = b.error || q.error || "";
  if(!b.error) BS = b.courses ? b : { courses: [] };
  if(!q.error) LEGACY = (q.quizzes||[]).filter(x=>!x.ou);   // quizzes added by link in the old UI, not from Brightspace
  if(k.key) SYNCKEY = k.key;
}
// Every 5 min while the tab is visible (only /bs): new data, but never re-draw over something the user is
// typing, picking or has open. Live has its own 10 s loop (visible only); Admin and Activity refresh on buttons.
const viewName = () => location.hash.replace(/^#/,"").split("/")[0];
function busy(){ const a=$("app"), f=document.activeElement;
  if(f && a.contains(f) && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName||"")) return true;
  if(a.querySelector("details[open]")) return true;
  return [...a.querySelectorAll("input")].some(i => i.value !== i.defaultValue); }
const shown = () => document.visibilityState !== "hidden";
let LAST = Date.now();
async function autoRefresh(){ if(!shown() || !["","class","connect"].includes(viewName())) return;
  LAST = Date.now(); const [b,m] = await Promise.all([get("/bs"), ME.verified||ME.admin ? {} : get("/me")]); LOADERR = b.error || "";
  if(m.email) ME = m;   // an unverified professor's banner clears once their Sync verifies them
  if(!b.error) BS = b.courses ? b : { courses: [] };
  if(!busy()) route(); }
document.addEventListener("visibilitychange", ()=>{ if(!shown() || !ME) return; const h=location.hash.replace(/^#/,"").split("/");
  if(h[0]==="live" && h[1]) loadLive(h[1]); else if(Date.now()-LAST > 300000) autoRefresh(); });
function nav(h){ location.hash = h; }
window.addEventListener("hashchange", route);

// ---- "Sync now": asks the LOCKqz Sync tab open in Brightspace to sync (the dashboard itself cannot read
// Brightspace: only the professor's own Brightspace tab can). Messages carry no data, and only to and from
// Brightspace's own address. No tab yet -> Brightspace opens in a new tab for one bookmark click.
const BS_ORIGINS = ["https://brightspace.usc.edu", "https://usc.brightspace.com"];
const BS_HOME = "https://brightspace.usc.edu/d2l/home";
let BSWIN = null, SYNCWAIT = null, SYNCMSG = "";
const SYNCBTN = prime => `<button class="btn${prime?" prime":""}" onclick="syncNow()">Sync now</button><span class="syncst muted">${syncHtml(SYNCMSG)}${SYNCHELPON ? SYNCHELP() : ""}</span>`;
// While a sync runs, the status shows the red lock loader (with how long it should take); otherwise plain text.
const syncHtml = t => t === "Syncing…" ? lqL("Syncing with Brightspace", "This usually takes under a minute", {small:true}) : esc(t);
// The LOCKqz Sync bookmark (runs sync.js inside the professor's Brightspace tab).
const bmkHref = () => SYNCKEY ? `javascript:(function(){var s=document.createElement('script');s.src='${location.origin}/sync.js?k=${SYNCKEY}&v='+Date.now();document.body.appendChild(s)})()` : "#";
const BMK = () => `<a class="bmk" href="${esc(bmkHref())}" onclick="alert('Drag this button to your bookmarks bar, then click it while you are in Brightspace.');return false">${SHIELD('#fff',18)} LOCKqz Sync</a>`;
const BARKEY = /Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent||"") ? "⌘ Shift B" : "Ctrl Shift B";
// Shown with Sync now whenever Brightspace has not answered: the 3 steps, right there.
const SYNCHELP = () => `<ol class="steps" style="margin:10px 0 0;text-align:left">
  <li>Show your bookmarks bar: press <b>${BARKEY}</b>.</li>
  <li>Drag ${BMK()} onto it.</li>
  <li>In the Brightspace tab, click <b>LOCKqz Sync</b>. Leave that tab open.</li></ol>`;
let SYNCHELPON = false;
function syncMsg(t, help = false){ SYNCMSG = t; SYNCHELPON = help; document.querySelectorAll(".syncst").forEach(e => e.innerHTML = syncHtml(t) + (help ? SYNCHELP() : "")); }
function askSync(w){ BS_ORIGINS.forEach(o => { try { w.postMessage({ lqz: "sync" }, o); } catch {} }); }
function syncNow(){
  if (SYNCWAIT) return;
  let w = BSWIN && !BSWIN.closed ? BSWIN : null;
  if (!w) {
    const t = window.open("", "lqzbs");     // the Brightspace tab this dashboard opened before, if still open
    let blank = true; try { blank = !t || t.location.href === "about:blank"; } catch { blank = false; }
    if (t && !blank) w = t;
    else {
      if (t) t.location.href = BS_HOME; else window.open(BS_HOME, "lqzbs");
      syncMsg("Brightspace opened in a new tab. Once:", true);
      return;
    }
  }
  syncMsg("Syncing…"); askSync(w);
  SYNCWAIT = setTimeout(() => { SYNCWAIT = null; syncMsg("Brightspace didn't answer. Once:", true); }, BSWIN ? 180000 : 10000);
}
window.addEventListener("message", async e => {

// ---- derived state ----
const now = () => Date.now();
const live = q => q.password && q.start_date && Date.parse(q.start_date) <= now() && (!q.end_date || Date.parse(q.end_date) > now()) && (!q.start_date || now() - Date.parse(q.start_date) < 6*3600e3);
const ended = q => (q.end_date && Date.parse(q.end_date) < now()) || (q.due_date && !q.end_date && Date.parse(q.due_date) < now() - 86400e3);
const current = c => c.quizzes.filter(q => q.active !== 0 && !ended(q));
// Brightspace does not match LOCKqz yet: on but our password not there, or off but our password still there.
const pend = q => q.password ? !q.bs_password_is_ours : !!q.bs_password_is_ours;
const pendingSync = () => BS.courses.some(c => c.quizzes.some(pend));
function classStats(c){
  const cur = current(c), prot = cur.filter(q=>q.password), ready = c.students.filter(s=>s.installed).length;
  const next = cur.filter(q=>q.start_date && Date.parse(q.start_date) > now()).sort((a,b)=>Date.parse(a.start_date)-Date.parse(b.start_date))[0];
  return { cur, prot, ready, next, missing: c.students.filter(s=>!s.installed), on: cur.length ? prot.length>0 : true, inprog: cur.filter(live) };
}

// ---- router ----
function route(){

  if(!ME.active && !ME.admin){ app.innerHTML = `<div id="pay">${lqL("Loading payment details", "This takes about 2 seconds")}</div>`; loadPay(); waitPaid(); return; }
  if(v==="class" && a) return app.innerHTML = viewClass(a);
  if(v==="live" && a) { app.innerHTML = viewLive(a); loadLive(a); liveTimer = setInterval(()=>{ if(shown()) loadLive(a); }, 10000); return; }
  if(v==="connect") return app.innerHTML = viewConnect();

function mailMissing(c,s,withBcc=true){

async function loadLive(id){

async function loadSessions(){ const d = await get("/sessions"); const tb=document.querySelector("#events tbody"); if(!tb) return; tb.innerHTML="";
  if(d.error){ tb.innerHTML=`<tr><td colspan="6" class="err">${esc(d.error)}</td></tr>`; return; }
  (d.events||[]).forEach(e=>tb.insertAdjacentHTML("beforeend",`<tr style="${e.event==='tamper'?'color:var(--usc);font-weight:700':''}"><td>${when(e.ts)}</td><td>${esc(e.student||"—")}</td><td style="white-space:nowrap">${esc(e.device_id||"")}${ME&&ME.admin&&e.device_id&&!/^ip:/.test(e.device_id)?` <button class="btn" style="min-height:28px;padding:2px 8px;font-size:12px" data-dev="${esc(e.device_id)}" onclick="revokeDev(this.dataset.dev)">Revoke</button>`:""}</td><td>${esc(qname(e.quiz_id))}</td><td>${esc(e.event)}</td><td>${esc(e.detail||"")}</td></tr>`));
  if(!(d.events||[]).length) tb.innerHTML=`<tr><td colspan="6" class="muted">Nothing yet.</td></tr>`; }

// ---- ADMIN (unchanged behaviour, moved under the name menu) ----
// Today in Los Angeles (YYYY-MM-DD) and the semester's last day, the same dates the server uses.
const laDay = () => { const p = {}; new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value); return `${p.year}-${p.month}-${p.day}`; };
function semEnd(){ const d=laDay(), y=d.slice(0,4), m=+d.slice(5,7); return m<=5?`${y}-05-31`:(m<=7?`${y}-08-15`:`${y}-12-31`); }
function viewAdmin(){ return `${BACK('', 'Home')}
  <section class="card"><h2 style="margin:0 0 12px">Invite a professor</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="iemail" type="email" placeholder="Professor's email" style="padding:10px;border:1px solid #cfccc4;border-radius:8px;flex:1 1 220px"><span class="muted">active until</span><input id="iuntil" type="date" value="${semEnd()}" style="padding:10px;border:1px solid #cfccc4;border-radius:8px"><button class="btn prime" onclick="makeInvite()">Create invite</button></div>
    <div id="newinvite"></div>
    <div style="overflow-x:auto;margin-top:12px"><table id="invites"><thead><tr><th>Email</th><th>Active until</th><th>Created</th><th>Status</th><th></th></tr></thead><tbody></tbody></table></div></section>
  <section class="card"><h2 style="margin:0 0 12px">Password reset requests</h2>
    <div style="overflow-x:auto"><table id="resets"><thead><tr><th>Email</th><th>Asked</th><th></th></tr></thead><tbody></tbody></table></div></section>
  <section class="card"><h2 style="margin:0 0 12px">Professors</h2>
    <div style="overflow-x:auto"><table id="teachers"><thead><tr><th>Email</th><th>Name</th><th>Joined</th><th>All sections until</th><th>Paid sections</th><th>Venmo code</th><th></th></tr></thead><tbody></tbody></table></div>
    <div id="secpanel"></div>
    <p class="muted">Payments with the professor's memo code activate them automatically. Otherwise pick the semester end date and Activate.</p>
  </section>
  <section class="card"><div class="hrow"><h2>Payments</h2><span id="feeinfo"></span></div>
    <p class="muted" style="margin:0 0 10px">Gmail script key: <code id="skey" style="user-select:all"></code></p>
    <div style="overflow-x:auto"><table id="payments"><thead><tr><th>Received</th><th>Amount</th><th>Via</th><th>From</th><th>Memo</th><th>Who</th><th></th></tr></thead><tbody></tbody></table></div>
</section>
  <section class="card"><h2 style="margin:0 0 12px">Delete a student's data</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="fgemail" type="email" placeholder="Student email" style="padding:10px;border:1px solid #cfccc4;border-radius:8px;flex:1 1 220px"><button class="btn" onclick="forget()">Delete</button></div></section>`; }
async function loadResets(){ const d = await get("/reset-requests"); const tb=document.querySelector("#resets tbody"); if(!tb) return;
  if(d.error){ tb.innerHTML=`<tr><td colspan="3" class="err">${esc(d.error)}</td></tr>`; return; }
  tb.innerHTML = (d.requests||[]).map(r=>`<tr><td>${esc(r.email)}</td><td>${when(r.at)}</td><td><button class="btn" style="min-height:32px;padding:4px 10px" data-email="${esc(r.email)}" onclick="resetPw(this.dataset.email)">Reset pw</button></td></tr>`).join("") || `<tr><td colspan="3" class="muted">None.</td></tr>`; }
async function forget(){ const email=$("fgemail").value.trim().toLowerCase(); if(!email) return;
  if(!confirm("Delete everything LOCKqz stores about "+email+"? This cannot be undone.")) return;
  const d=await post("/forget",{email}); alert(d.error||("Deleted "+email+": "+(d.devices??0)+" device(s), "+(d.roster_rows??0)+" class-list row(s).")); if(!d.error) $("fgemail").value=""; }
async function loadTeachers(){ const d = await get("/teachers"); const tb=document.querySelector("#teachers tbody"); if(!tb) return; tb.innerHTML=""; const today=laDay();
  if(d.error){ tb.innerHTML=`<tr><td colspan="7" class="err">${esc(d.error)}</td></tr>`; return; }
  (d.teachers||[]).forEach(t=>{ const on = t.active_until && t.active_until>=today;
    tb.insertAdjacentHTML("beforeend",`<tr style="${on?'':'color:#888'}"><td>${esc(t.email)}</td><td>${esc(t.name||"")}</td><td>${when(t.created_at)}</td><td>${on?esc(t.active_until):"<b style='color:#990000'>off</b>"}</td><td>${t.paid_sections||0}</td><td>${esc(t.memo||"")}</td><td style="white-space:nowrap"><button class="btn" style="min-height:32px;padding:4px 10px" data-email="${esc(t.email)}" onclick="secAdmin(this.dataset.email)">Sections</button> <input type="date" id="d_${esc(t.id)}" value="${esc(t.active_until||semEnd())}" style="padding:4px"> <button class="btn" style="min-height:32px;padding:4px 10px" data-email="${esc(t.email)}" data-id="${esc(t.id)}" onclick="activate(this.dataset.email,this.dataset.id)">Activate</button> <button class="btn" style="min-height:32px;padding:4px 10px" data-email="${esc(t.email)}" onclick="deactivate(this.dataset.email)">Off</button> <button class="btn" style="min-height:32px;padding:4px 10px" data-email="${esc(t.email)}" onclick="resetPw(this.dataset.email)">Reset pw</button></td></tr>`); }); }
// ---- per-section payment ($1,000 per section per semester, Venmo) ----
let PAY=null, PAYSEL=null, PAYAT=0;
const termName = t => { t=String(t||""); return (({1:"Spring",2:"Summer",3:"Fall"})[t.slice(4)]||"")+" "+t.slice(0,4); };
const money = n => "$"+Number(n).toLocaleString("en-US");
async function loadPay(name){ const el=$("pay"); if(!el) return;
  const d = await get("/my-sections"+(name?("?name="+encodeURIComponent(name)):"")); if(d.error){ if(name) alert(d.error); return; }
  PAY=d; PAYAT=Date.now(); PAYSEL=new Set(d.sections.filter(s=>!s.paid).map(s=>s.section)); renderPay(); }
let PAYWAIT=null;
// Unpaid: check every 15 s while the tab is visible (stops when hidden); opens LOCKqz the moment the payment lands.
function waitPaid(){ if(PAYWAIT) return; PAYWAIT = setInterval(async()=>{ if(document.visibilityState==="hidden") return; const m = await get("/me"); if(m && m.active){ clearInterval(PAYWAIT); PAYWAIT=null; ME=m; await refresh(); route(); } }, 15000); }
function paySel(s,on){ on?PAYSEL.add(s):PAYSEL.delete(s); renderPay(); }
function renderPay(){ const d=PAY, el=$("pay"); if(!el||!d) return;
  if(d.all_active || (d.sections.length && d.sections.every(s=>s.paid))){ el.innerHTML=""; return; }   // nothing left to pay
  const usc = /@usc\.edu$/i.test((ME&&ME.email)||"");   // the Schedule of Classes lookup is USC's
  const nameBox = !usc ? "" : `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label for="pname" class="muted">Name in the USC Schedule of Classes</label><input id="pname" value="${esc(d.name||"")}" placeholder="First Last" style="padding:10px;border:1px solid #cfccc4;border-radius:8px;flex:1 1 200px"><button class="btn" onclick="loadPay($('pname').value)">Find my sections</button></div>`;
  const total=d.amount??d.price, note=d.memo, got=Number(d.received)||0;
  const link = d.venmo ? `https://venmo.com/?txn=pay&recipients=${encodeURIComponent(d.venmo)}&amount=${total}&note=${encodeURIComponent(note)}` : "";
  el.innerHTML = `<section class="card" style="display:flex;flex-direction:column;gap:16px">
    <div class="hrow"><h2>Activate LOCKqz</h2><span>${d.term?termName(d.term):""}</span></div>
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><b style="font-size:44px">${money(total)}</b><span class="muted">per semester · all your sections</span>${got>0?`<b style="color:var(--warn)">Received ${money(got)} of ${money(total)}</b>`:""}</div>
    ${d.sections.length ? `<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px">${d.sections.map(s=>`<li style="display:flex;gap:12px;align-items:center;min-height:40px;padding:0 12px;border:1px solid #e3e0d8;border-radius:10px"><b>${esc(s.course)}</b><span class="muted">Section ${esc(s.section)}</span></li>`).join("")}</ul>` : `${!usc?"":!d.term?`<p class="muted" style="margin:0">Enter your first and last name.</p>`:d.name?`<p class="muted" style="margin:0">No sections found for ${esc(d.name)}.</p>`:""}${nameBox}`}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
      ${d.stripe ? `<button class="btn prime" onclick="stripePay('card',this)">Card ${money(d.stripe.card)}</button>${d.stripe.bank ? `<button class="btn" onclick="stripePay('bank',this)">Bank account ${money(d.stripe.bank)}</button>` : ""}` : ""}
      ${d.zelle ? `<div style="padding:14px;border:1px solid #e3e0d8;border-radius:10px"><span class="muted">Zelle</span><br><b>${esc(d.zelle)}</b></div>` : ""}
      ${link ? `<a class="btn prime" style="text-align:center;display:flex;align-items:center;justify-content:center" href="${link}" target="_blank" rel="noopener">Venmo ${money(total)}</a>` : ""}
      ${d.invoice ? `<a class="btn" style="text-align:center;display:flex;align-items:center;justify-content:center" href="mailto:${esc(d.invoice)}?subject=${encodeURIComponent("LOCKqz invoice "+d.memo)}&body=${encodeURIComponent("Please send an invoice for LOCKqz, "+termName(d.term)+", "+money(total)+".")}">Bank transfer (ACH / wire)</a>` : ""}
      ${d.po ? `<a class="btn" style="text-align:center;display:flex;align-items:center;justify-content:center" href="mailto:${esc(d.po)}?subject=${encodeURIComponent("LOCKqz purchase order "+d.memo)}&body=${encodeURIComponent("PO number:\nBilling contact:\nAmount: "+money(total)+"\nTerm: "+termName(d.term)+"\nMemo: "+d.memo)}">Purchase order (PO)</a>` : ""}
      ${!d.zelle && !link && !d.invoice ? `<p style="margin:0">Pay ${money(total)} to the LOCKqz admin.</p>` : ""}
    </div><p class="muted" style="margin:0">Memo: <b>${esc(note)}</b></p>
    ${lqL("Processing your payment", "This should take no longer than a minute")}
    ${d.sections.length && usc ? `<details><summary class="muted">Not your sections?</summary>${nameBox}</details>` : ""}
  </section>`; }
async function stripePay(method,btn){ btn.disabled=true; const t=btn.textContent; btn.textContent="…";
  const d = await post("/pay/stripe-prof",{method, back: location.origin + location.pathname});
  if(d && d.url){ location.href=d.url; return; } btn.disabled=false; btn.textContent=t; alert((d&&d.error)||"Try again."); }
async function secAdmin(email){ const el=$("secpanel"); el.innerHTML=lqL("Loading sections", "This takes about 2 seconds", {small:true});
  const d = await get("/teacher-sections?email="+encodeURIComponent(email)); if(d.error){ el.innerHTML=esc(d.error); return; }
  el.innerHTML = `<div class="card" style="margin-top:12px;display:flex;flex-direction:column;gap:10px"><b>${esc(d.email)} · ${esc(d.name||"no name")} · ${termName(d.term)} · Venmo code ${esc(d.memo)}</b>
    ${d.sections.length ? d.sections.map(s=>`<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" class="secck" value="${esc(s.section)}" ${s.paid?"checked":""}> ${esc(s.course)} · ${esc(s.section)} ${s.paid?"<b style='color:var(--ok)'>paid to "+esc(s.paid_until)+"</b>":""}</label>`).join("") : "<span class='muted'>No sections found for this name.</span>"}
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="muted">paid until</span><input type="date" id="secuntil" value="${semEnd()}" style="padding:6px"><button class="btn prime" data-email="${esc(d.email)}" data-term="${esc(d.term)}" onclick="markSecs(this.dataset.email,this.dataset.term,false)">Mark ticked paid</button><button class="btn" data-email="${esc(d.email)}" data-term="${esc(d.term)}" onclick="markSecs(this.dataset.email,this.dataset.term,true)">Mark ticked unpaid</button></div></div>`; }
async function markSecs(email,term,off){ const sections=[...document.querySelectorAll(".secck:checked")].map(x=>x.value); if(!sections.length) return;
  if(!off && !$("secuntil").value){ alert("Pick the paid-until date first."); return; }
  const d=await post("/pay-sections",{email,term,sections,until:$("secuntil").value,off}); if(d.error) alert(d.error); secAdmin(email); loadTeachers(); }
async function loadPayments(){ const d = await get("/payments"); const tb=document.querySelector("#payments tbody"); if(!tb) return;
  if(d.error){ tb.innerHTML=`<tr><td colspan="7" class="err">${esc(d.error)}</td></tr>`; return; }
  $("skey").textContent = d.script_key||""; $("feeinfo").textContent = d.fee_on ? `Student fee $${d.fee} on` : (d.fee_from ? `Student fee starts ${d.fee_from}` : "Student fee off");
  tb.innerHTML = (d.payments||[]).map(p=>`<tr><td>${when(p.received_at)}</td><td>${money(p.amount)}</td><td>${esc(p.via||"")}</td><td>${esc(p.payer||"")}</td><td>${esc(p.note||"")}</td><td>${p.void||p.voided?"<b>void</b>":p.who?esc(p.who):"<b style='color:#990000'>unmatched</b>"}</td><td style="white-space:nowrap"><input id="as_${esc(p.txn)}" placeholder="email or code" style="padding:4px;width:150px"> <button class="btn" style="min-height:32px;padding:4px 10px" data-txn="${esc(p.txn)}" onclick="assignPay(this.dataset.txn)">${p.who?"Reassign":"Assign"}</button> <button class="btn" style="min-height:32px;padding:4px 10px" data-txn="${esc(p.txn)}" onclick="voidPay(this.dataset.txn)">Void</button></td></tr>`).join("") || `<tr><td colspan="7" class="muted">No payments yet.</td></tr>`; }
async function assignPay(txn){ const i=document.getElementById("as_"+txn), v=i?i.value.trim():""; if(!v) return;
  const d=await post("/pay-assign",{txn,code:v}); if(d.error) alert(d.error); loadPayments(); }
async function voidPay(txn){ if(!confirm("Void this payment? It stops counting toward anyone.")) return; const d=await post("/pay-void",{txn}); if(d.error) alert(d.error); loadPayments(); }
async function activate(email,id){ const until=$("d_"+id).value; if(!until){ alert("Pick the active-until date first."); return; }   // an empty date would turn them OFF
  const d=await post("/activate",{email,until}); if(d.error) alert(d.error); loadTeachers(); }
async function deactivate(email){ if(confirm("Turn off "+email+"?")){ const d=await post("/activate",{email,until:null}); if(d.error) alert(d.error); loadTeachers(); } }
async function resetPw(email){ const d=await post("/reset",{email}); alert(d.error||("New password for "+email+": "+d.password+(d.sync_key_kept?"\n\n"+d.sync_key_kept:""))); }
const inviteLink = code => location.origin + "/?invite=" + code;
function inviteMail(email, link){
  const s = "Your LOCKqz professor account";
  const b = "Hi,\n\nYou're invited to LOCKqz. It blocks AI on students' computers during your Brightspace exams, then turns AI back on when the exam ends.\n\n"
    + "1. Create your account (this link works once):\n   " + link + "\n\n"
    + "2. Drag the LOCKqz Sync button to your bookmarks bar and click it once in Brightspace. Your classes and exams fill in; every exam is protected automatically.\n\n"
    + "3. Students install LOCKqz once from " + INSTALL + " (the dashboard emails the ones who haven't).\n\nLOCKqz";
  return "mailto:" + (email||"") + "?subject=" + encodeURIComponent(s) + "&body=" + encodeURIComponent(b);
}
async function makeInvite(){ const d = await post("/invite",{email:$("iemail").value,until:$("iuntil").value||semEnd()}); if(d.error){ alert(d.error); return; }
  window._ilink = inviteLink(d.code); window._imail = inviteMail(d.email, window._ilink);
  $("newinvite").innerHTML = `<div class="note ok" style="margin-top:10px"><span>Invite link (works once): <code>${esc(window._ilink)}</code></span><span style="display:flex;gap:8px"><button class="btn" onclick="navigator.clipboard.writeText(window._ilink);this.textContent='Copied'">Copy link</button><button class="btn prime" onclick="location.href=window._imail">Email it</button></span></div>`;
  $("iemail").value=""; loadInvites(); }
async function loadInvites(){ const d = await get("/invites"); const tb=document.querySelector("#invites tbody"); if(!tb) return; tb.innerHTML="";
  if(d.error){ tb.innerHTML=`<tr><td colspan="5" class="err">${esc(d.error)}</td></tr>`; return; }
  (d.invites||[]).forEach(i=>tb.insertAdjacentHTML("beforeend",`<tr style="${i.used_at?'color:#888':''}"><td>${esc(i.email||"(anyone with link)")}</td><td>${esc(i.active_until||"—")}</td><td>${when(i.created_at)}</td><td>${i.used_at?"joined":"pending"}</td><td>${i.used_at?"":`<button class="btn" style="min-height:32px;padding:4px 10px" data-code="${esc(i.code)}" onclick="cancelInvite(this.dataset.code)">Cancel</button>`}</td></tr>`));
  if(!(d.invites||[]).length) tb.innerHTML=`<tr><td colspan="5" class="muted">No invites yet.</td></tr>`; }
async function cancelInvite(code){ if(!confirm("Cancel this invite?")) return; const d=await post("/uninvite",{code}); if(d.error){ alert(d.error); return; } if((window._ilink||"").endsWith("="+code)){ $("newinvite").innerHTML=""; window._ilink=window._imail=null; } loadInvites(); }

// An invite link (/?invite=CODE or /dashboard?invite=CODE) opens the sign-up form; without one, only Sign in shows.
(async function initInvite(){
  INVITE = (new URLSearchParams(location.search).get("invite")||"").trim();
  if(!INVITE) return;
  const d = await get("/invite-check?code="+encodeURIComponent(INVITE));
  if(!d.ok){ INVITE=""; $("lerr").textContent="This invite link is invalid or was already used. Ask the LOCKqz admin for a new one."; return; }
  if(!signup) toggle();
  $("signuprow").classList.remove("hide");
  if(d.email){ $("email").value=d.email; $("email").readOnly=true; }
})();

boot();
</script>
</body></html>
