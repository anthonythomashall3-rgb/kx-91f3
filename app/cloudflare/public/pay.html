<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOCKqz — Pay</title>
<style>
  :root { --usc:#990000; }
  html,body{min-height:100%} body{margin:0;display:grid;place-items:center;font:16px -apple-system,Segoe UI,sans-serif;background:#fafafa;color:#111}
  .card{text-align:center;max-width:440px;padding:24px 20px 32px;box-sizing:border-box;width:100%;display:flex;flex-direction:column;gap:16px}
  h1{color:#111;font-size:42px;margin:0;letter-spacing:-1px}
  .price{font-size:52px;font-weight:800;letter-spacing:-2px;margin:0}
  .price span{font-size:17px;font-weight:400;color:#666;letter-spacing:0}
  .price #amt{font-size:inherit;font-weight:800;color:#111;letter-spacing:-2px}
  label{font-weight:700;font-size:14px;text-align:left}
  input{min-height:50px;padding:0 14px;font-size:17px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box;width:100%}
  .btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:10px;font-weight:700;font-size:17px;text-decoration:none;border:0;cursor:pointer}
  .prime{background:var(--usc);color:#fff}
  .box{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-height:54px;padding:10px 16px;border:1px solid #ddd;border-radius:10px;background:#fff;box-sizing:border-box}
  .or{display:flex;align-items:center;gap:12px;color:#888;font-size:14px}.or::before,.or::after{content:"";flex:1;height:1px;background:#e3e3e3}
  .spin{width:16px;height:16px;border:2px solid #ddd;border-top-color:var(--usc);border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:8px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
  .link{background:none;border:0;color:#666;font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
  .muted{color:#666;font-size:14px}
  .memo{font-size:15px}
  .memo b{font-size:20px;letter-spacing:1px}
  .ok{color:#1a7f37;font-weight:800;font-size:22px}
  [hidden]{display:none!important}
</style></head>
<body>
<main class="card">
  <h1><span class="lq-l">LOCK</span><span class="lq-q">qz</span></h1>
  <p class="price" id="price" hidden><span id="amt"></span> <span>per semester</span></p>

  <form id="f" style="display:flex;flex-direction:column;gap:10px">
    <label for="em">School email</label>
    <input id="em" type="email" autocomplete="email" placeholder="you@usc.edu" required>
    <button class="btn prime" type="submit">Continue</button>
  </form>
  <div id="ld"></div>

  <section id="pay" hidden style="display:flex;flex-direction:column;gap:12px">
    <button class="btn prime" id="card" type="button" hidden></button>
    <button class="btn" id="ach" type="button" hidden style="background:#fff;border:1px solid #ccc"></button>
    <p class="muted" id="achwait" hidden>Bank payment pending · about 4 business days</p>
    <p class="or" id="or0" hidden>or</p>
    <a class="btn prime" id="venmo" href="#" target="_blank" rel="noopener" hidden>Venmo</a>
    <p class="or" id="or" hidden>or</p>
    <div class="box" id="zelle" hidden><span class="muted" id="zamt">Zelle</span><b id="zto"></b></div>
    <p class="or" id="or2" hidden>or</p>
    <a class="box" id="bank" href="#" hidden style="text-decoration:none;color:inherit"><span class="muted">Bank transfer (ACH / wire)</span><b id="bto"></b></a>
    <a class="box" id="po" href="#" hidden style="text-decoration:none;color:inherit"><span class="muted">Purchase order (PO)</span><b id="poto"></b></a>
    <p class="memo">Memo: <b id="code"></b></p>
    <p class="muted" id="memohint">Put the memo on the payment. It only pays for this email.</p>
    <p class="muted" id="got" hidden></p>
    <div id="wait"></div>
    <button class="btn" id="again" type="button" style="background:#fff;border:1px solid #ccc">Check again</button>
  </section>

  <p class="ok" id="done" hidden>Paid ✓</p>
  <p class="muted" id="untilp" hidden>Access until <span id="until"></span></p>
  <p id="renewp" hidden><button class="link" id="renew" type="button"></button></p>
  <p class="ok" id="free" hidden>No payment needed yet</p>
  <p class="muted" id="err" hidden></p>
</main>
<script src="/lq.js"></script>
<script>
// The red lock loader from /lq.js (plain text if it did not load).
const lqL = (m, e, o) => typeof lqLoading === "function" ? lqLoading(m, e, o) : m + "…";
const API = /\.pages\.dev$/.test(location.hostname) ? "https://lockqz.pages.dev/api" : "/api", $ = id => document.getElementById(id);
const money = n => "$" + Number(n).toLocaleString("en-US");
// Polling: 10 s, slowing to 60 s; stops after 15 min or while the tab is hidden ("Check again" restarts it).
let poll = null, polls = 0, since = 0, who = null;
function stopPoll(){ clearTimeout(poll); poll = null; }
function schedule(){ stopPoll();
  if (document.visibilityState === "hidden") return;
  if (Date.now() - since > 15 * 60000) { $("wait").textContent = "Paid already? Check again."; return; }
  if (!/lqload/.test($("wait").innerHTML || "")) $("wait").innerHTML = WAITING();
  poll = setTimeout(check, Math.min(60000, 10000 * Math.pow(1.5, polls++))); }
const WAITING = () => lqL("Processing your payment", "This should take no longer than a minute");
function startPoll(){ polls = 0; since = Date.now(); $("wait").innerHTML = WAITING(); schedule(); }
function showGot(got, due){ got = Number(got) || 0; $("got").hidden = !(got > 0); if (got > 0) $("got").textContent = "Received " + money(got) + " of " + money(due); }
async function check(){
  if (!who) return;
  try { const s = await (await fetch(API + "/pay/status?email=" + encodeURIComponent(who.email) + "&code=" + encodeURIComponent(who.code || ""))).json();
    if (s.paid) return paid();
    showGot(s.received, s.amount ?? who.amount);
  } catch {}
  schedule();
}
async function start(email){
  $("err").hidden = true; $("ld").innerHTML = lqL("Finding your account", "This takes about 2 seconds");
  let d; try { d = await (await fetch(API + "/pay/start", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ email }) })).json(); } catch { d = { error:"No connection. Try again." }; }
  $("ld").innerHTML = "";
  if (d.error) { $("err").textContent = d.error; $("err").hidden = false; return; }
  history.replaceState(null, "", "?email=" + encodeURIComponent(email));
  if (!d.required) { stopPoll(); $("f").hidden = true; $("pay").hidden = true; $("free").hidden = false; return; }   // fee not on yet
  const amt = money(d.amount);
  $("amt").textContent = amt; $("price").hidden = false;
  UNTIL = d.until; renewUi(email, d.renew);
  if (d.paid) return paid();
  who = { email, code: d.code, amount: d.amount };
  $("code").textContent = d.code;
  showGot(d.received, d.amount);
  if (d.venmo) { $("venmo").href = `https://venmo.com/?txn=pay&recipients=${encodeURIComponent(d.venmo)}&amount=${encodeURIComponent(d.amount)}&note=${encodeURIComponent(d.code)}`; $("venmo").textContent = `Venmo ${amt} to @${d.venmo}`; $("venmo").hidden = false; }
  if (d.zelle) { $("zamt").textContent = d.zelle_amount ? "Zelle exactly " + "$" + Number(d.zelle_amount).toLocaleString("en-US", { minimumFractionDigits: 2 }) + " · no memo needed" : "Zelle " + amt; $("zto").textContent = d.zelle; $("zelle").hidden = false; $("or").hidden = !d.venmo; }
  if (d.bank) { $("bto").textContent = "Email " + d.bank; $("bank").href = `mailto:${d.bank}?subject=${encodeURIComponent("LOCKqz bank transfer " + d.code)}&body=${encodeURIComponent("Please send bank transfer details for " + amt + ", memo " + d.code + " (" + email + ").")}`; $("bank").hidden = false; $("or2").hidden = !(d.zelle || d.venmo); }
  if (d.po) { $("poto").textContent = "Email " + d.po; $("po").href = `mailto:${d.po}?subject=${encodeURIComponent("LOCKqz purchase order " + d.code)}&body=${encodeURIComponent("PO number:\nBilling contact:\nAmount: " + amt + "\nMemo: " + d.code + " (" + email + ")")}`; $("po").hidden = false; }
  if (d.stripe) {
    $("card").textContent = "Card " + money(d.stripe.card); $("card").onclick = () => stripe(email, "card"); $("card").hidden = false;
    $("ach").textContent = "Bank account " + money(d.stripe.bank); $("ach").onclick = () => stripe(email, "bank"); $("ach").hidden = !d.stripe.bank;
    $("or0").hidden = !(d.venmo || d.zelle || d.bank);
  }
  $("achwait").hidden = qs.get("stripe") !== "bank";
  $("memohint").textContent = d.zelle_amount ? "Bank transfer or PO: put the memo on it." : "Put the memo on the payment. It only pays for this email.";
  $("f").hidden = true; $("pay").hidden = false;
  startPoll();
}
async function stripe(email, method){
  $("err").hidden = true; const b = $(method === "card" ? "card" : "ach"), t = b.textContent; b.disabled = true; b.innerHTML = '<span class="spin"></span>' + t;
  let d; try { d = await (await fetch(API + "/pay/stripe", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ email, method }) })).json(); } catch { d = { error:"No connection. Try again." }; }
  if (d.url) { location.href = d.url; return; }
  b.disabled = false; b.textContent = t; $("err").textContent = d.error || "Try again."; $("err").hidden = false;
}
function paid(){ stopPoll(); who = null; $("f").hidden = true; $("pay").hidden = true; $("done").hidden = false;
  if (UNTIL) { $("until").textContent = new Date(UNTIL + "T12:00:00").toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" }); $("untilp").hidden = false; } }
let UNTIL = null;
function renewUi(email, on){ $("renew").textContent = on === false ? "Turn renewal emails on" : "Stop renewal emails"; $("renewp").hidden = false;
  $("renew").onclick = async () => { try { const r = await (await fetch(API + "/pay/renew", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ email, on: on === false }) })).json(); if (r.ok) renewUi(email, r.renew); } catch {} }; }
$("again").addEventListener("click", () => { since = Date.now(); polls = 0; stopPoll(); check(); });
document.addEventListener("visibilitychange", () => { if (!who) return; if (document.visibilityState === "hidden") stopPoll(); else { since = Date.now(); polls = 0; stopPoll(); check(); } });
$("f").addEventListener("submit", e => { e.preventDefault(); start($("em").value.trim().toLowerCase()); });
const qs = new URLSearchParams(location.search), q = qs.get("email");
(async () => {
  if (q && qs.get("renew") === "off") try { await fetch(API + "/pay/renew", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ email: q.trim().toLowerCase(), on: false }) }); } catch {}
  if (q) { $("em").value = q; start(q.trim().toLowerCase()); }
})();
</script>
</body></html>
