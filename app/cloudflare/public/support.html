<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOCKqz — Support</title>
<style>
  :root{--usc:#990000}
  body{font:16px/1.5 -apple-system,Segoe UI,sans-serif;margin:0;color:#111;background:#fff}
  header{background:#fff;color:#111;padding:12px 18px;font-weight:700;border-bottom:3px solid var(--usc)}
  main{padding:20px 16px;max-width:560px;margin:0 auto}
  .back{display:inline-block;margin:0 0 16px;color:var(--usc);font-weight:600;text-decoration:none}
  .back:hover{text-decoration:underline}
  label{display:block;font-weight:600;margin:14px 0 6px}
  input,textarea{box-sizing:border-box;width:100%;font:inherit;padding:10px 12px;border:1px solid #ccc;border-radius:10px;background:#fff;color:#111}
  input:focus,textarea:focus{outline:2px solid var(--usc);outline-offset:1px;border-color:var(--usc)}
  textarea{min-height:160px;resize:vertical}
  .btn{display:inline-block;margin:16px 0 0;padding:12px 22px;border:0;border-radius:10px;background:var(--usc);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{margin:12px 0 0;min-height:1.5em}.ok{color:#1a7f37;font-weight:600}.bad{color:#c62828}
  .alt{margin:28px 0 0;padding-top:14px;border-top:1px solid #eee;color:#555;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
  .alt b{color:#111}
  .copy{border:1px solid #ccc;background:#fff;border-radius:8px;padding:4px 10px;font:inherit;font-size:14px;cursor:pointer}
  .trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style><script src="/lq.js"></script>
</head>
<body>
<header>LOCKqz — Support</header>
<main>
<a class="back" href="/">&larr; Back</a>
<form id="f" novalidate>
  <label for="em">Your email</label>
  <input id="em" name="email" type="email" autocomplete="email" required>
  <label for="nm">Name <span style="font-weight:400;color:#666">(optional)</span></label>
  <input id="nm" name="name" type="text" autocomplete="name" maxlength="100">
  <label for="ms">Message</label>
  <textarea id="ms" name="message" maxlength="5000" required></textarea>
  <div class="trap" aria-hidden="true"><label for="ws">Website</label><input id="ws" name="website" tabindex="-1" autocomplete="off"></div>
  <button class="btn" id="go" type="submit">Send</button>
  <p class="msg" id="out" role="status" aria-live="polite"></p>
</form>
<p class="alt">Or email <b id="addr">lockqz.app@gmail.com</b> <button class="copy" id="cp" type="button">Copy</button></p>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  try { var acct = JSON.parse(localStorage.getItem("lqz_acct") || "null"); if (acct && acct.email) $("em").value = acct.email; } catch (e) {}
  $("cp").addEventListener("click", function () {
    var t = $("addr").textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { $("cp").textContent = "Copied"; }, function () {
      var r = document.createRange(); r.selectNodeContents($("addr")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); });
  });
  $("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var out = $("out"), email = $("em").value.trim(), message = $("ms").value.trim();
    out.className = "msg bad";
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { out.textContent = "Enter your email."; $("em").focus(); return; }
    if (message.length < 5) { out.textContent = "Write your message."; $("ms").focus(); return; }
    $("go").disabled = true; out.className = "msg"; out.textContent = "Sending…";
    fetch("/api/support", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, name: $("nm").value.trim(), message: message, website: $("ws").value }) })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (d) {
        if (d && d.ok) { out.className = "msg ok"; out.textContent = "Sent. We'll reply to " + email + "."; $("ms").value = ""; }
        else { out.className = "msg bad"; out.textContent = (d && d.error) || "Could not send. Email lockqz.app@gmail.com."; $("go").disabled = false; }
      }, function () { out.className = "msg bad"; out.textContent = "Could not send. Email lockqz.app@gmail.com."; $("go").disabled = false; });
  });
})();
</script>
</body></html>
