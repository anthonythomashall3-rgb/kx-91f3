name: Build Windows installer

# Builds lockqz-win.exe on a Windows runner (Inno Setup only compiles on Windows), then
# INSTALLS it on that real Windows machine and tests lock / unlock / API / uninstall.
# The installer is only uploaded if every check passes.
on:
  workflow_dispatch:
  push:
    paths:
      - "app/windows/**"
      - "app/tests/test_windows_install.ps1"
      - ".github/workflows/windows-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Make a fresh local token for this build
        shell: pwsh
        run: |
          $t = "lqz-" + [guid]::NewGuid().ToString("N").Substring(0,16)
          "LQTOKEN=$t" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile installer
        working-directory: app/windows
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DLQTOKEN=$env:LQTOKEN" `
            "/DLQAPI=https://lockdownqz.pages.dev/api" `
            installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install + test on this Windows machine (Windows PowerShell 5.1, like students)
        shell: powershell
        run: |
          & .\app\tests\test_windows_install.ps1 -Exe "$PWD\app\windows\Output\lockqz-win.exe" -Token $env:LQTOKEN
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lockqz-win
          path: app/windows/Output/lockqz-win.exe
          if-no-files-found: error
