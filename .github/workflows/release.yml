name: Release

# Every push to master: run every test suite, build + install-test the Mac .pkg and Windows .exe on
# real runners, build the SIGNED update manifest, and deploy the site + API + database migrations
# to Cloudflare. Installed helpers then pick up the new release on their own (signed self-update).
# Nothing here costs money: GitHub Actions (public repo or free minutes) + Cloudflare free tier.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   LOCKQZ_UPDATE_KEY      the RSA private key (PEM) whose public half is app/mac/update.pub
#   CLOUDFLARE_API_TOKEN   Cloudflare API token with Pages:Edit + D1:Edit on the account
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
# Until those exist, the deploy job prints what is missing and does nothing else.

on:
  push:
    branches: [master]
    # No paths-ignore: every push to master runs the "what changed" step, which compares HEAD with the
    # commit that is LIVE (lockqz.pages.dev/api/version), not with the previous push. So a push the
    # previous head commit's [skip ci] silenced, or a docs-only push after a lost deploy, still deploys.
    # Docs-only differences end the run in seconds. Never write [skip ci] in a commit message.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: All test suites (Linux)
    runs-on: ubuntu-latest
    # Cheaper builds (25 Oct 2026): the macOS runner bills 10x and Windows 2x, so the Mac / Windows
    # build jobs run ONLY when a push changes what goes into them. A site/API-only push = Linux only;
    # the deploy then reuses the installers already live on lockqz.pages.dev.
    outputs:
      deploy: ${{ steps.chg.outputs.deploy }}
      mac: ${{ steps.chg.outputs.mac }}
      win: ${{ steps.chg.outputs.win }}
      linux: ${{ steps.chg.outputs.linux }}
      android: ${{ steps.chg.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: What changed (decides which platform builds run)
        id: chg
        env: { BEFORE: "${{ github.event.before }}" }
        run: |
          # Base = the commit that is live (api field of /api/version); fall back to the push's "before".
          live=$(curl -fsS -m 15 -A "LOCKqz/ci" https://lockqz.pages.dev/api/version | sed -n 's/.*"api":"\([0-9a-f]*\)".*/\1/p' || true)
          base=""
          if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null; then base=$(git rev-parse "$live"); echo "live: $live"; fi
          if [ -z "$base" ] && [ "${{ github.event_name }}" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base="$BEFORE"; fi
          if [ -z "$base" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "mac=true" >> "$GITHUB_OUTPUT"; echo "win=true" >> "$GITHUB_OUTPUT"; echo "linux=true" >> "$GITHUB_OUTPUT"; echo "android=true" >> "$GITHUB_OUTPUT"; echo "full build"; exit 0; fi
          files=$(git diff --name-only "$base" "$GITHUB_SHA")
          echo "$files"
          docs='(^|/)[^/]*\.md$|^0[0-9]*_[^/]*/|^LOCKqz-USC/|^[^/]*\.(pdf|xlsx)$'
          if [ "${{ github.event_name }}" = "push" ] && ! echo "$files" | grep -v -E "$docs" | grep -q .; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "mac=false" >> "$GITHUB_OUTPUT"; echo "win=false" >> "$GITHUB_OUTPUT"; echo "linux=false" >> "$GITHUB_OUTPUT"; echo "android=false" >> "$GITHUB_OUTPUT"; echo "nothing deployable changed since $base"; exit 0; fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          common='^(app/release/|app/VERSION$|\.github/)'
          echo "$files" | grep -qE "$common|^app/mac/|^app/tests/test_mac_" && echo "mac=true" >> "$GITHUB_OUTPUT" || echo "mac=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE "$common|^app/windows/|^app/tests/test_windows_" && echo "win=true" >> "$GITHUB_OUTPUT" || echo "win=false" >> "$GITHUB_OUTPUT"
          # Linux shares lockqzd.py / lockqz-agent.py / browser-policy.py / lockqz-core.sh / blocklist.txt with the Mac.
          echo "$files" | grep -qE "^app/android/|^app/VERSION$|^\.github/" && echo "android=true" >> "$GITHUB_OUTPUT" || echo "android=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE "$common|^app/linux/|^app/mac/(lockqzd\.py|lockqz-agent\.py|browser-policy\.py|lockqz-core\.sh|blocklist\.txt)$|^app/tests/test_linux_" && echo "linux=true" >> "$GITHUB_OUTPUT" || echo "linux=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.chg.outputs.deploy == 'true'
        with: { node-version: 22 }
      - name: Run every suite
        if: steps.chg.outputs.deploy == 'true'
        run: |
          rc=0; bash app/tests/run_all.sh > "$RUNNER_TEMP/tests.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/tests.log"
          # Failing lines become annotations (readable through the API without downloading the log).
          if [ "$rc" -ne 0 ]; then
            awk '/^######## /{s=$0; gsub(/#/,"",s)} /FAIL|Error:|Exception|Cannot |not recognized/{l=$0; gsub(/::/,": ",l); print "::error title=" substr(s,1,80) "::" substr(l,1,300)}' "$RUNNER_TEMP/tests.log" | head -25
          fi
          exit $rc

  mac:
    name: Build + install-test the Mac package
    needs: test
    if: needs.test.outputs.mac == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the .pkg, install it, lock/unlock, uninstall
        run: bash app/tests/test_mac_install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lockqz-mac
          path: /tmp/lockqz-mac.pkg
          if-no-files-found: error

  linux:
    name: Install-test on Linux (real Ubuntu - hosts, nftables, policies, agent tab reading)
    needs: test
    if: needs.test.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Chromium for the agent's tab-reading check
        run: (npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium) >/dev/null 2>&1 || echo "no Chromium - tab-reading check will be skipped"
      - name: Install, lock/unlock, uninstall
        run: |
          rc=0; bash app/tests/test_linux_install.sh > "$RUNNER_TEMP/linux.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/linux.log"
          if [ "$rc" -ne 0 ]; then grep -E '^FAIL|^INSTALL-LOG|^JOURNAL|Error|error:|Traceback' "$RUNNER_TEMP/linux.log" | head -60 | sed 's/^/::error title=Linux install test::/'; fi
          exit $rc

  android:
    name: Build + unit-test the Android app (signed APK)
    needs: test
    if: needs.test.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Unit tests + signed release APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          LOCKQZ_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          cd app/android
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            umask 077; echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lockqz.jks"; export LOCKQZ_KEYSTORE="$RUNNER_TEMP/lockqz.jks"
          else
            echo "::warning::no ANDROID_KEYSTORE_B64 secret: APK signed with the debug key (see app/android/README.md to add the real key)"
          fi
          echo "gradle $(gradle --version 2>/dev/null | grep -E '^Gradle' ) ANDROID_HOME=$ANDROID_HOME"
          rc=0; gradle -q testDebugUnitTest assembleRelease --no-daemon > "$RUNNER_TEMP/gradle.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/gradle.log"
          if [ "$rc" -ne 0 ]; then grep -E '^e: |error|What went wrong|^> |FAILED|Exception' "$RUNNER_TEMP/gradle.log" | head -40 | cut -c1-400 | sed 's/^/::error title=Android build::/'; fi
          rm -f "$RUNNER_TEMP/lockqz.jks"
          [ "$rc" -eq 0 ] || exit $rc
          cp app/build/outputs/apk/release/app-release.apk ../../lockqz-android.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | tail -1)/apksigner" verify --print-certs ../../lockqz-android.apk | head -2
      - uses: actions/upload-artifact@v4
        with:
          name: lockqz-android
          path: lockqz-android.apk
          if-no-files-found: error

  windows:
    name: Build + install-test the Windows installer
    needs: test
    if: needs.test.outputs.win == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Windows signing + self-update checks (PowerShell 5.1, what students run)
        shell: powershell
        run: |
          & .\app\tests\test_windows_signing.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # (PowerShell 7 run of the same suite happens on the cheap Linux runner via run_all.sh)
      - name: Windows one-time email setup (real Setup-Identity, PowerShell 5.1)
        shell: powershell
        run: |
          & .\app\tests\test_windows_email_setup.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Quiz opened from Brightspace Content - moved to its own page in real Chrome, Edge, Firefox (PowerShell 5.1)
        shell: powershell
        run: |
          & .\app\tests\test_windows_content_move.ps1 -Out "$env:RUNNER_TEMP\lqz-move"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Fresh local token for this build
        shell: pwsh
        run: |
          $t = "lqz-" + [guid]::NewGuid().ToString("N").Substring(0,16)
          "LQTOKEN=$t" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LQVER=" + (Get-Content app/VERSION -Raw).Trim() | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Compile installer
        working-directory: app/windows
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DLQTOKEN=$env:LQTOKEN" `
            "/DLQAPI=https://lockqz.pages.dev/api" `
            "/DLQVER=$env:LQVER" `
            installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install + test on this Windows machine (Windows PowerShell 5.1, like students)
        shell: powershell
        run: |
          & .\app\tests\test_windows_install.ps1 -Exe "$PWD\app\windows\Output\lockqz-win.exe" -Token $env:LQTOKEN
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: lockqz-win
          path: app/windows/Output/lockqz-win.exe
          if-no-files-found: error

  windows-store:
    name: Build + install-test the Microsoft Store package (MSIX)
    needs: test
    if: needs.test.outputs.win == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test-signed MSIX - install, open inside the package, lock/unlock, Store update, remove
        shell: powershell
        run: |
          & .\app\tests\test_windows_store.ps1 -Shot "$env:RUNNER_TEMP\store\screenshot-1366x768.png"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Store upload package (identity from Partner Center -> repo Variables MSIX_NAME / MSIX_PUBLISHER / MSIX_PUBLISHER_DISPLAY)
        if: vars.MSIX_NAME != ''
        shell: powershell
        run: |
          & .\app\windows\store\build-msix.ps1 -Name "${{ vars.MSIX_NAME }}" -Publisher "${{ vars.MSIX_PUBLISHER }}" -PublisherDisplay "${{ vars.MSIX_PUBLISHER_DISPLAY }}" -Out "$env:RUNNER_TEMP\store\lockqz-store.msix"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item app\windows\store\Assets\StoreListing300.png "$env:RUNNER_TEMP\store\"
      - uses: actions/upload-artifact@v4
        with:
          name: lockqz-store
          path: ${{ runner.temp }}/store
          if-no-files-found: error

  deploy:
    name: Sign the release + deploy to Cloudflare
    needs: [test, mac, windows, linux, android]
    runs-on: ubuntu-latest
    # Runs when tests passed and each platform build either passed or was skipped (nothing changed).
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.test.result == 'success' && needs.test.outputs.deploy == 'true' &&
      (needs.mac.result == 'success' || needs.mac.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.android.result == 'success' || needs.android.result == 'skipped')
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check the one-time secrets
        id: chk
        env:
          UPDATE_KEY: ${{ secrets.LOCKQZ_UPDATE_KEY }}
        run: |
          ok=true
          [ -n "$UPDATE_KEY" ]            || { echo "::warning::missing secret LOCKQZ_UPDATE_KEY (release-signing private key)"; ok=false; }
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || { echo "::warning::missing secret CLOUDFLARE_API_TOKEN"; ok=false; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::warning::missing secret CLOUDFLARE_ACCOUNT_ID"; ok=false; }
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = true ] || echo "Deploy skipped: add the secrets above (see the header of this workflow), then re-run."
      - uses: actions/download-artifact@v4
        if: steps.chk.outputs.ok == 'true' && needs.mac.result == 'success'
        with:
          name: lockqz-mac
          path: app/cloudflare/public/download
      - uses: actions/download-artifact@v4
        if: steps.chk.outputs.ok == 'true' && needs.windows.result == 'success'
        with:
          name: lockqz-win
          path: app/cloudflare/public/download
      - uses: actions/download-artifact@v4
        if: steps.chk.outputs.ok == 'true' && needs.android.result == 'success'
        with:
          name: lockqz-android
          path: app/cloudflare/public/download
      - name: Reuse the live installers for any platform that was not rebuilt
        if: steps.chk.outputs.ok == 'true'
        run: |
          set -e; d=app/cloudflare/public/download; mkdir -p "$d"
          get(){ [ -s "$d/$1" ] && return 0
                 curl -fsS -A "LOCKqz/ci" -o "$d/$1" "https://lockqz.pages.dev/download/$1"
                 head -c 4 "$d/$1" | grep -q "$2" || { echo "::error::live $1 is not a real installer"; exit 1; }
                 echo "reused live $1"; }
          get lockqz-mac.pkg xar!
          get lockqz-win.exe MZ
          get lockqz-android.apk PK || true   # none live before the first Android build
      - name: Build the signed update manifest + one-line installers
        if: steps.chk.outputs.ok == 'true'
        env:
          UPDATE_KEY: ${{ secrets.LOCKQZ_UPDATE_KEY }}
        run: |
          umask 077; printf '%s\n' "$UPDATE_KEY" > "$RUNNER_TEMP/update_key.pem"
          python3 app/release/make-manifest.py --key "$RUNNER_TEMP/update_key.pem" --out app/cloudflare/public/download
          rm -f "$RUNNER_TEMP/update_key.pem"
          cp app/mac/install.sh app/mac/uninstall.sh app/windows/install.ps1 app/windows/uninstall.ps1 app/cloudflare/public/
          cp app/linux/install.sh app/cloudflare/public/install-linux.sh; cp app/linux/uninstall.sh app/cloudflare/public/uninstall-linux.sh
          ls -la app/cloudflare/public/download app/cloudflare/public/download/mac app/cloudflare/public/download/windows
      - name: Stripe (key + webhook into Cloudflare; skipped until the STRIPE_SECRET_KEY GitHub secret exists)
        if: steps.chk.outputs.ok == 'true'
        working-directory: app/cloudflare
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_RESET_WEBHOOK: ${{ vars.STRIPE_RESET_WEBHOOK }}
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ]; then npm ci --no-audit --no-fund; fi
          bash ../payments/stripe-setup.sh
      - name: Email (Amazon SES keys into Cloudflare; skipped until the SES_* GitHub secrets exist)
        if: steps.chk.outputs.ok == 'true'
        working-directory: app/cloudflare
        env:
          SES_ACCESS_KEY_ID: ${{ secrets.SES_ACCESS_KEY_ID }}
          SES_SECRET_ACCESS_KEY: ${{ secrets.SES_SECRET_ACCESS_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SES_REGION: ${{ vars.SES_REGION }}
          SES_DAILY_MAX: ${{ vars.SES_DAILY_MAX }}
        run: |
          if [ -n "$SES_ACCESS_KEY_ID" ]; then npm ci --no-audit --no-fund; fi
          bash ../payments/mail-setup.sh
      - name: Deploy (schema + migrations + site + API + teacher site + legacy forwarders)
        if: steps.chk.outputs.ok == 'true'
        working-directory: app/cloudflare
        run: |
          npm ci --no-audit --no-fund
          bash deploy.sh
      - name: Live check
        if: steps.chk.outputs.ok == 'true'
        run: |
          set -e
          curl -fsS -A "LOCKqz/ci" https://lockqz.pages.dev/download/update.json | head -c 200; echo
          curl -fsS -A "LOCKqz/ci" https://lockqz.pages.dev/api/blocklist | python3 -c 'import sys,json; d=json.load(sys.stdin)["domains"]; assert len(d)>=90, len(d); print("blocklist ok:", len(d))'
          # Real content, not just "200": a deploy without installers serves the HTML page instead.
          t=$(mktemp -d)
          magic(){ curl -fsSL -A "LOCKqz/ci" -o "$t/f" -D "$t/h" "$1"; ct=$(grep -i '^content-type:' "$t/h" | tail -1 | tr -d '\r')
                   [ "$(head -c ${#2} "$t/f")" = "$2" ] || { echo "::error::$1 is not $3 ($ct)"; exit 1; }
                   if echo "$ct" | grep -qi 'text/html'; then echo "::error::$1 served as HTML"; exit 1; fi; echo "ok $1 ($ct)"; }
          magic https://lockqz.pages.dev/download/lockqz-mac.pkg 'xar!' "a .pkg"
          magic https://lockqz.pages.dev/download/lockqz-win.exe 'MZ' "an .exe"
          magic https://lockqz.pages.dev/download/lockqz-android.apk 'PK' "an .apk"
          magic https://lockqz.pages.dev/install.sh '#!' "a shell script"
          for f in install.ps1 uninstall.sh uninstall.ps1 install-linux.sh uninstall-linux.sh; do curl -fsSL -A "LOCKqz/ci" -o "$t/f" "https://lockqz.pages.dev/$f"; ! grep -qi '<html' "$t/f" || { echo "::error::$f is HTML"; exit 1; }; done
          curl -fsS -A "LOCKqz/ci" -o "$t/u.json" https://lockqz.pages.dev/download/update.json
          curl -fsS -A "LOCKqz/ci" -o "$t/u.sig" https://lockqz.pages.dev/download/update.sig
          openssl base64 -d -A -in "$t/u.sig" -out "$t/u.bin"
          openssl dgst -sha256 -verify app/mac/update.pub -signature "$t/u.bin" "$t/u.json"
          for h in lockqz.pages.dev lockdownqz.pages.dev; do curl -fsS -A "LOCKqz/ci" "https://$h/api/version"; echo; done
