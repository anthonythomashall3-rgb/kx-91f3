name: DNS records

# Keeps lockqz.com's email records as written here (run by hand: Actions -> DNS records -> Run workflow).
# Needs a CLOUDFLARE_API_TOKEN that may edit the zone's DNS; with a token that may not, it says so and stops.
on:
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: _dmarc.lockqz.com
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          NAME=_dmarc.lockqz.com
          # Mail that says it is from lockqz.com but is not signed for it goes to the receiver's junk folder.
          # (LOCKqz's own emails are sent from its Gmail address; before sending From lockqz.com, sign with DKIM.)
          WANT='v=DMARC1; p=quarantine; rua=mailto:support@lockqz.com'
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          Z=$(api "https://api.cloudflare.com/client/v4/zones?name=lockqz.com" | jq -r '.result[0].id // empty')
          [ -n "$Z" ] || { echo "::error::this token cannot see the lockqz.com zone"; exit 1; }
          R=$(api "https://api.cloudflare.com/client/v4/zones/$Z/dns_records?type=TXT&name=$NAME")
          [ "$(echo "$R" | jq -r .success)" = true ] || { echo "::error::this token cannot read DNS records: $(echo "$R" | jq -c .errors)"; exit 1; }
          ID=$(echo "$R" | jq -r '.result[0].id // empty'); HAVE=$(echo "$R" | jq -r '.result[0].content // empty' | tr -d '"')
          if [ "$HAVE" = "$WANT" ]; then echo "$NAME is already: $HAVE"; exit 0; fi
          BODY=$(jq -nc --arg n "$NAME" --arg c "\"$WANT\"" '{type:"TXT",name:$n,content:$c,ttl:3600}')
          if [ -n "$ID" ]; then O=$(api -X PUT "https://api.cloudflare.com/client/v4/zones/$Z/dns_records/$ID" --data "$BODY")
          else O=$(api -X POST "https://api.cloudflare.com/client/v4/zones/$Z/dns_records" --data "$BODY"); fi
          [ "$(echo "$O" | jq -r .success)" = true ] || { echo "::error::this token cannot write DNS records: $(echo "$O" | jq -c .errors)"; exit 1; }
          echo "$NAME set to: $WANT"
