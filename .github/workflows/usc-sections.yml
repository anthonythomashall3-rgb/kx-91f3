# Refresh LOCKqz's copy of USC's public Schedule of Classes (who teaches which section), used to bill
# $1,000 per section and to list a professor's sections the moment they sign up. No AI, no login.
# Runs once a day (enrollment and instructor changes), on demand, and when the builder changes. $0.
name: USC sections
on:
  schedule: [ { cron: "17 10 * * *" } ]   # daily; only changed rows are written
  workflow_dispatch:
  push:
    branches: [master]
    paths: [ "app/usc/build_sections.py", "app/cloudflare/migrate_017_sections.sql", ".github/workflows/usc-sections.yml" ]
concurrency: { group: usc-sections, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Refresh the section index (writes only what changed)
        working-directory: app/cloudflare
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::warning::missing CLOUDFLARE_API_TOKEN"; exit 0; }
          # Daily only while instructors change (registration: Apr 1-May 15, Nov 1-Dec 15; first 3 weeks
          # of a term: Jan 8-31, May 15-Jun 7, Aug 20-Sep 14); otherwise only on Mondays. Manual runs always.
          md=$(TZ=America/Los_Angeles date +%m%d); dow=$(TZ=America/Los_Angeles date +%u)
          busy=0; for r in 0401-0515 1101-1215 0108-0131 0515-0607 0820-0914; do [ "$md" -ge "${r%-*}" ] && [ "$md" -le "${r#*-}" ] && busy=1; done
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$busy" = 0 ] && [ "$dow" != 1 ]; then echo "quiet period, not Monday: skipped"; exit 0; fi
          npm ci --no-audit --no-fund
          # What D1 already holds (reads are cheap; writes are the free-plan limit).
          npx wrangler d1 execute lockqz --remote --json --command "SELECT term,section,course,title,first,last FROM usc_sections" > "$RUNNER_TEMP/current.json"
          python3 ../usc/build_sections.py "$RUNNER_TEMP/changes.sql" "$RUNNER_TEMP/current.json"
          # Apply in small batches with --command (never --file: a failed --file restores the whole DB).
          python3 - "$RUNNER_TEMP/changes.sql" <<'PY'
          import subprocess, sys
          lines = [l.strip() for l in open(sys.argv[1]) if l.strip()]
          print(len(lines), "changes")
          # Guard (25 Oct 2026): a full reload once cost ~119k D1 writes and blew the free daily limit
          # (100k), which broke student email setup for a whole day. Never write more than 3,000 rows a run.
          if len(lines) > 3000:
              print("::error::%d changes is too many for one run (free D1 limit) - nothing written" % len(lines)); sys.exit(1)
          for i in range(0, len(lines), 50):
              subprocess.run(["npx", "wrangler", "d1", "execute", "lockqz", "--remote", "--command", " ".join(lines[i:i+50])], check=True)
          PY
